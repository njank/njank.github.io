            updateQuickNav();

            // Capture the selected node's screen position before re-render to restore scroll afterwards
            const anchorNode = selectedPersonId ? document.querySelector(`.person-node[data-id="${selectedPersonId}"]`) : null;
            const beforeRect = anchorNode ? anchorNode.getBoundingClientRect() : null;

            renderTree();
            updateHighlight();

            // Perform scroll restoration synchronously to avoid visible jumps
            if (anchorNode && beforeRect && currentViewMode === 'tree') {
                const newAnchor = document.querySelector(`.person-node[data-id="${selectedPersonId}"]`);
                if (newAnchor) {
                    const afterRect = newAnchor.getBoundingClientRect();
                    document.getElementById('canvas-container').scrollLeft += (afterRect.left - beforeRect.left);
                    document.getElementById('canvas-container').scrollTop += (afterRect.top - beforeRect.top);
                }
            }
            if (currentViewMode === 'map') openMap();
            if (!skipHistory) pushToHistory();
        }

        function scrollToPerson(id, animate = true) {
            const node = document.querySelector(`.person-node[data-id="${id}"]`);
            if (node) {
                const container = $('#canvas-container');
                const containerRect = container[0].getBoundingClientRect();
                const zcRect = document.getElementById('zoom-container').getBoundingClientRect();
                const rect = node.getBoundingClientRect();
                const unscaledX = (rect.left + rect.width / 2 - zcRect.left) / canvasZoom;
                const unscaledY = (rect.top + rect.height / 2 - zcRect.top) / canvasZoom;
                const scrollTop = (unscaledY * canvasZoom) - containerRect.height / 2;
                const scrollLeft = (unscaledX * canvasZoom) - containerRect.width / 2;
                if (animate) container.animate({ scrollTop, scrollLeft }, 300);
                else { container.scrollTop(scrollTop); container.scrollLeft(scrollLeft); }
            }
        }

        // Deterministic hue derived from the lowercase letters of a surname.
        function getColor(lastName) {
            if (!lastName) return '#e5e7eb';
            let hash = 0;
            const str = lastName.toLowerCase().replace(/[^a-z]/g, '');
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 65%)`;
        }

        // organizes an array of persons by grouping them under the same father, then the same mother,
        // followed by chronological order (birth year), with the database ID acting as a final tie-breaker.
        function sortChildren(childrenArray) {
            return childrenArray.sort((a, b) => {
                const fA = a.fatherId || 0, fB = b.fatherId || 0;
                if (fA !== fB) return fA - fB;
                const mA = a.motherId || 0, mB = b.motherId || 0;
                if (mA !== mB) return mA - mB;
                const bA = getBirthYear(a.id);
                const bB = getBirthYear(b.id);
                if (bA !== bB) return bA - bB;
                return a.id - b.id;
            });
        }

        // Returns a person's own events plus any Marriage events from other persons that list them as involved.
        function getDisplayEvents(personId) {
            const events = [];
            const p = getPerson(personId);
            if (!p) return events;
            (p.events || []).forEach((e, i) => events.push({ ...e, sourceId: personId, originalIndex: i }));
            db.persons.forEach(other => {
                if (other.id !== personId) {
                    (other.events || []).forEach((e, i) => {
                        if (e.type === 'Marriage' && e.involvedPersonId === personId) {
                            events.push({ ...e, sourceId: other.id, originalIndex: i });
                        }
                    });
                }
            });
            return events;
        }

        function getPartners(personId) {
            const partners = new Set();
            getDisplayEvents(personId).forEach(e => {
                if (e.type === 'Marriage') {
                    if (e.sourceId !== personId) partners.add(e.sourceId);
                    else if (e.involvedPersonId) partners.add(e.involvedPersonId);
                }
            });
            db.persons.forEach(c => {
                if (c.fatherId === personId && c.motherId) partners.add(c.motherId);
                if (c.motherId === personId && c.fatherId) partners.add(c.fatherId);
            });
            const pList = Array.from(partners).filter(id => getPerson(id) && id !== personId);
            pList.sort((a, b) => getEarliestChildBirth(personId, a) - getEarliestChildBirth(personId, b));
            return pList;
        }

        function getSharedChildren(p1, p2) {
            return db.persons.filter(c => (c.fatherId === p1 && c.motherId === p2) || (c.fatherId === p2 && c.motherId === p1));
        }

        function getEarliestChildBirth(p1, p2) {
            let earliest = 9999;
            getSharedChildren(p1, p2).forEach(k => {
                const b = (k.events || []).find(e => e.type === 'Birth');
                if (b && parseInt(b.date) < earliest) earliest = parseInt(b.date);
            });
            return earliest;
        }

        // Detects if a female has any male partner currently visible (not suppressed) in the tree.
        function hasActiveMalePartner(femaleId) {
            for (const pid of getPartners(femaleId)) {
                const p = getPerson(pid);
                if (p && p.gender === 'm' && !suppressedIds.has(pid)) return true;
            }
            return false;
        }

        function buildEventsHtml(personId) {
            const displayEvents = getDisplayEvents(personId);
            const birth = displayEvents.find(e => e.type === 'Birth');
            const death = displayEvents.find(e => e.type === 'Death');
            const marriage = displayEvents.find(e => e.type === 'Marriage');
            const showPlace = displayInfoModes.events;

            function evCol(ev, iconHtml, isCenter, isEnd) {
                if (!ev) return `<div></div>`;
                const jClass = isCenter ? 'justify-center' : (isEnd ? 'justify-end' : 'justify-start');
                const alignClass = isCenter ? 'text-center' : (isEnd ? 'text-right' : 'text-left');
                const placeHtml = (showPlace && ev.place) ? `<div class="text-[9px] text-gray-400 truncate leading-none mt-0.5 px-0.5 ${alignClass}" title="${ev.place}">${ev.place}</div>` : '';
                return `<div class="flex flex-col overflow-hidden text-gray-600" title="${ev.note || ''}">
                    <div class="flex items-center gap-1 ${jClass}">
                        ${iconHtml} <span class="truncate">${ev.date || ''}</span>
                    </div>
                    ${placeHtml}
                </div>`;
            }

            const bHtml = evCol(birth, `<i class="ph ph-star text-[12px] flex-shrink-0 text-gray-500"></i>`, false, false);
            const mHtml = evCol(marriage, ICONS.marriage, true, false);
            const dHtml = evCol(death, `<i class="ph ph-cross text-[12px] flex-shrink-0 text-gray-500"></i>`, false, true);

            return `<div class="grid grid-cols-3 gap-1 w-full text-gray-600">${bHtml}${mHtml}${dHtml}</div>`;
        }

        function updateValidationUI(p) {
            const hasOneParent = (p.fatherId && !p.motherId) || (!p.fatherId && p.motherId);
            const hasNoLastName = !p.lastName || p.lastName.trim() === '';

            $('#edit-father, #edit-mother, #edit-lastName').removeClass('ring-2 ring-amber-500 border-amber-500 bg-amber-50');
            if (hasOneParent) {
                if (!p.fatherId) $('#edit-father').addClass('ring-2 ring-amber-500 border-amber-500 bg-amber-50');
                if (!p.motherId) $('#edit-mother').addClass('ring-2 ring-amber-500 border-amber-500 bg-amber-50');
            }
            if (hasNoLastName) $('#edit-lastName').addClass('ring-2 ring-amber-500 border-amber-500 bg-amber-50');
        }

        // --- CARD RENDERING HELPERS ---

        function buildWarningHtml(p) {
            const warnings = [];
            if ((p.fatherId && !p.motherId) || (!p.fatherId && p.motherId)) warnings.push(t('parentMissing'));
            if (!p.lastName || p.lastName.trim() === '') warnings.push(t('lastNameMissing'));
            return warnings.length > 0 ? `<i class="ph ph-warning text-amber-500 mr-1" title="${warnings.join(' / ')}"></i>` : '';
        }

        // Builds the collapsible extra-info section shown below a card's events row.
        function buildExtraInfoHtml(p) {
            let html = '';
            if (displayInfoModes.events) {
                const minorEvents = getDisplayEvents(p.id).filter(e => !['Birth', 'Death', 'Marriage'].includes(e.type));
                if (minorEvents.length > 0) {
                    const minorHtml = minorEvents.map(e => {
                        const text = [e.date, e.place, e.note].filter(x => x).join(' - ');
                        const iconHtml = ICONS[e.type.toLowerCase()] || ICONS.other;
                        return `<div class="flex items-center gap-1 truncate text-gray-500" title="${text}">${iconHtml} <span class="truncate">${text}</span></div>`;
                    }).join('');
                    html += `<div class="text-[11px] mt-1.5 pt-1.5 border-t border-gray-100 leading-tight flex flex-col gap-1">${minorHtml}</div>`;
                }
            }
            if (displayInfoModes.address && p.address) {
                html += `<div class="text-[11px] text-gray-500 mt-1.5 pt-1.5 border-t border-gray-100 leading-tight overflow-hidden flex items-start gap-1" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;"><i class="ph ph-house text-gray-400 text-sm"></i> <span>${p.address}</span></div>`;
            }
            if (displayInfoModes.notes && p.notes) {
                html += `<div class="text-[11px] text-gray-500 mt-1.5 pt-1.5 border-t border-gray-100 italic leading-tight overflow-hidden" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${p.notes}</div>`;
            }
            return html;
        }

        function createCard(id) {
            const p = getPerson(id);
            if (!p) return '';

            const borderColor = getColor(p.lastName);
            const bgColor = (p.category && p.category !== 'none' && CATEGORY_COLORS[p.category]) ? (CATEGORY_COLORS[p.category] + '33') : '#ffffff';
            const isSelected = selectedPersonId === id ? 'ring-2 ring-blue-500 shadow-xl' : '';

            const fatherIcon = p.fatherId ? `<i class="ph ph-user-gear text-blue-500 text-lg"></i>` : `<i class="ph ph-user-plus text-blue-400 text-lg"></i>`;
            const motherIcon = p.motherId ? `<i class="ph ph-user-gear text-pink-500 text-lg"></i>` : `<i class="ph ph-user-plus text-pink-400 text-lg"></i>`;
            const spouseIcon = `<svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" stroke-width="2"/><circle cx="16" cy="12" r="4" stroke-width="2"/></svg>`;
            const childIcon = `<i class="ph ph-baby text-green-500 text-lg"></i>`;

            const roman = romanNumerals[id] ? `<span class="text-gray-400 ml-1">${romanNumerals[id]}</span>` : '';
            const titleSpanAttr = p.title ? `title="${p.title.replace(/"/g, '&quot;')}"` : '';
            const fullNameAttr = `${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} ${p.lastName || ''} ${romanNumerals[id] || ''}`.trim().replace(/\s+/g, ' ').replace(/"/g, '&quot;');

            const warningHtml = buildWarningHtml(p);
            const extraInfoHtml = buildExtraInfoHtml(p);

            let actionButtonsHtml = '';
            if (displayInfoModes.actions) {
                actionButtonsHtml = `
                <div class="flex justify-between border-t border-gray-100 bg-black/5 rounded-b-lg action-buttons mt-auto h-7">
                    <div class="action-father flex items-center justify-center w-1/4 border-r border-gray-200/60 hover:bg-black/5 transition-colors cursor-pointer text-gray-600" title="${p.fatherId ? t('editFather') : t('addFather')}">
                        ${fatherIcon}
                    </div>
                    <div class="action-mother flex items-center justify-center w-1/4 border-r border-gray-200/60 hover:bg-black/5 transition-colors cursor-pointer text-gray-600" title="${p.motherId ? t('editMother') : t('addMother')}">
                        ${motherIcon}
                    </div>
                    <div class="action-spouse flex items-center justify-center w-1/4 border-r border-gray-200/60 hover:bg-black/5 transition-colors cursor-pointer text-gray-600" title="${t('addSpouse')}">
                        ${spouseIcon}
                    </div>
                    <div class="action-child flex items-center justify-center w-1/4 hover:bg-black/5 transition-colors cursor-pointer text-gray-600" title="${t('addChild')}">
                        ${childIcon}
                    </div>
                </div>`;
            }

            return `
                <div class="person-node w-64 bg-white border border-gray-300 rounded-lg shadow-md relative hover:shadow-lg transition-all cursor-pointer z-10 flex flex-col ${isSelected}"
                     data-id="${id}" style="border-left: 6px solid ${borderColor}; background-color: ${bgColor};">
                    <div class="p-1 pb-1.5 flex-grow overflow-hidden">
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <div class="flex flex-col overflow-hidden w-full">
                                <span class="text-[10px] text-gray-400 font-bold uppercase truncate leading-none mb-1" ${titleSpanAttr}>${p.title || ''}</span>
                                <div class="font-bold text-gray-800 text-sm leading-tight truncate" title="${fullNameAttr}">
                                    ${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} <span class="uppercase">${p.lastName || ''}</span>${roman}
                                </div>
                            </div>
                            <div class="flex-shrink-0 flex items-center ml-1">
                                ${warningHtml}
                                ${p.gender === 'm' ? ICONS.male : ICONS.female}
                            </div>
                        </div>
                        <div class="mt-1.5 text-[11px] flex flex-col gap-0.5 min-h-[1.5rem] events-container">
                            ${buildEventsHtml(p.id)}
                        </div>
                        ${extraInfoHtml}
                    </div>
                    ${actionButtonsHtml}
                </div>`;
        }

        function calculateSuppressed() {
            suppressedIds.clear();
            const q = Array.from(collapsedFamilies);
            let qi = 0;
            while (qi < q.length) {
                const curr = q[qi++];
                const p = getPerson(curr);
                if (!p) continue;

                const kidsToSuppress = [];
                if (p.gender === 'm') {
                    kidsToSuppress.push(...db.persons.filter(c => c.fatherId === curr && !c.motherId).map(c => c.id));
                    getPartners(curr).forEach(partnerId => {
                        kidsToSuppress.push(...getSharedChildren(curr, partnerId).map(c => c.id));
                        kidsToSuppress.push(...db.persons.filter(c => c.motherId === partnerId && !c.fatherId).map(c => c.id));
                    });
                } else {
                    kidsToSuppress.push(...db.persons.filter(c => c.motherId === curr && !c.fatherId).map(c => c.id));
                }

                kidsToSuppress.forEach(kId => {
                    if (!suppressedIds.has(kId)) {
                        suppressedIds.add(kId);
                        q.push(kId);
                    }
                });
            }
        }

        // Returns the collapse/expand toggle button HTML for a family group node.
        function buildCollapseBtn(id, isCollapsed) {
            const icon = isCollapsed ? '<i class="ph ph-plus text-xs"></i>' : '<i class="ph ph-minus text-xs"></i>';
            return `<button class="collapse-toggle-btn absolute -right-3 top-1/2 transform -translate-y-1/2 bg-white border border-gray-300 rounded-full w-5 h-5 flex items-center justify-center text-gray-600 z-30 hover:bg-gray-100 shadow cursor-pointer transition-colors" data-id="${id}">${icon}</button>`;
        }

        function renderFamily(maleId, expectedGen = 0) {
            if (renderedIds.has(maleId)) return '';
            renderedIds.add(maleId);
            const actualGen = personGen[maleId] || 0;
            const margin = Math.max(0, (actualGen - expectedGen) * 320);
            const partners = getPartners(maleId);

            const $fam = $('<div class="flex flex-row gap-16 items-stretch family-group relative"></div>');
            if (margin > 0) $fam.css('margin-left', margin + 'px');

            const $parentsBox = $(`<div class="flex flex-col gap-1 justify-center items-center relative parents-box" data-id="${maleId}"></div>`);
            $parentsBox.append(createCard(maleId));

            partners.forEach(partnerId => {
                if (!renderedIds.has(partnerId)) {
                    $parentsBox.append(createCard(partnerId));
                    renderedIds.add(partnerId);
                }
            });

            const childrenToRender = [];
            childrenToRender.push(...sortChildren(db.persons.filter(c => c.fatherId === maleId && !c.motherId)).filter(c => shouldRenderAsChild(c.id)));
            partners.forEach(partnerId => {
                childrenToRender.push(...sortChildren(getSharedChildren(maleId, partnerId)).filter(c => shouldRenderAsChild(c.id)));
                childrenToRender.push(...sortChildren(db.persons.filter(c => c.motherId === partnerId && !c.fatherId)).filter(c => shouldRenderAsChild(c.id)));
            });

            if (childrenToRender.length > 0) {
                const isCollapsed = collapsedFamilies.has(maleId);
                $parentsBox.append(buildCollapseBtn(maleId, isCollapsed));
                if (!isCollapsed) {
                    const $childrenCol = $('<div class="flex flex-col gap-1 justify-center items-start children-box"></div>');
                    childrenToRender.forEach(c => { $childrenCol.append(renderChild(c.id, actualGen + 1)); });
                    $fam.append($parentsBox);
                    $fam.append($childrenCol);
                    return $fam;
                }
            }

            $fam.append($parentsBox);
            return $fam;
        }

        function renderChild(childId, expectedGen = 0) {
            if (renderedIds.has(childId)) return '';
            const child = getPerson(childId);
            if (!child) return '';
            if (child.gender === 'm') return renderFamily(childId, expectedGen);

            renderedIds.add(childId);
            const actualGen = personGen[childId] || 0;
            const margin = Math.max(0, (actualGen - expectedGen) * 320);

            const $singleFam = $('<div class="flex flex-row gap-16 items-stretch family-group relative"></div>');
            if (margin > 0) $singleFam.css('margin-left', margin + 'px');

            const $parentsBox = $(`<div class="flex flex-col gap-1 justify-center items-center relative parents-box" data-id="${childId}"></div>`);
            $parentsBox.append(createCard(childId));

            const singleKids = sortChildren(db.persons.filter(p => p.motherId === childId && !p.fatherId));
            const childrenToRender = singleKids.filter(k => shouldRenderAsChild(k.id));

            if (childrenToRender.length > 0) {
                const isCollapsed = collapsedFamilies.has(childId);
                $parentsBox.append(buildCollapseBtn(childId, isCollapsed));
                if (!isCollapsed) {
                    const $childrenCol = $('<div class="flex flex-col gap-1 justify-center items-start children-box"></div>');
                    childrenToRender.forEach(k => { $childrenCol.append(renderChild(k.id, actualGen + 1)); });
                    $singleFam.append($parentsBox);
                    if ($childrenCol.children().length > 0) $singleFam.append($childrenCol);
                    return $singleFam;
                }
            }

            $singleFam.append($parentsBox);
            return $singleFam;
        }

        function shouldRenderAsChild(id) {
            const p = getPerson(id);
            if (!p) return false;
            if (p.gender === 'm') return true;
            if (hasActiveMalePartner(id)) return false;
            return true;
        }

        // Returns a flat ordered list of root IDs where wife's parents roots are placed
        // immediately after the husband's root so they appear as adjacent rows in the tree.
        function orderRootsSmartly(rawRoots) {
            const personToRoot = {};
            function assignRoot(pId, rId) {
                if (personToRoot[pId]) return;
                personToRoot[pId] = rId;
                db.persons.forEach(c => { if (c.fatherId === pId || c.motherId === pId) assignRoot(c.id, rId); });
            }
            rawRoots.forEach(r => assignRoot(r, r));

            // For each root, find which other roots contain a "branch-in" wife whose husband is in this root's tree.
            const linkedAfter = {};
            rawRoots.forEach(r => { linkedAfter[r] = []; });
            db.persons.forEach(p => {
                if (p.gender !== 'f') return;
                const herRoot = personToRoot[p.id];
                if (!herRoot) return;
                getPartners(p.id).forEach(partnerId => {
                    const hisRoot = personToRoot[partnerId];
                    if (hisRoot && hisRoot !== herRoot && rawRoots.includes(hisRoot) && rawRoots.includes(herRoot)) {
                        if (!linkedAfter[hisRoot].includes(herRoot)) linkedAfter[hisRoot].push(herRoot);
                    }
                });
            });

            // Emit each root, immediately followed by any wife's parents roots linked to it.
            const emitted = new Set();
            const ordered = [];
            rawRoots.forEach(r => {
                if (emitted.has(r)) return;
                ordered.push(r);
                emitted.add(r);
                linkedAfter[r].forEach(linked => {
                    if (!emitted.has(linked)) {
                        ordered.push(linked);
                        emitted.add(linked);
                    }
                });
            });
            return ordered;
        }

        function renderTree() {
            renderedIds.clear();
            $('#tree-layer').empty();

            if (db.persons.length === 0) {
                $('#empty-state').removeClass('hidden');
                $('#canvas-container').addClass('hidden');
                $('#map-container').addClass('hidden');
                return;
            }

            $('#empty-state').addClass('hidden');
            if (currentViewMode === 'tree') {
                $('#canvas-container').removeClass('hidden');
                $('#map-container').addClass('hidden');
            } else if (currentViewMode === 'map') {
                $('#map-container').removeClass('hidden');
                $('#canvas-container').addClass('hidden');
            }

            calculateSuppressed();

            let roots = [];
            db.persons.forEach(p => {
                const hasParent = (p.fatherId && getPerson(p.fatherId)) || (p.motherId && getPerson(p.motherId));
                if (!hasParent && !suppressedIds.has(p.id)) {
                    if (p.gender === 'm') roots.push(p.id);
                    else if (p.gender === 'f' && !hasActiveMalePartner(p.id)) roots.push(p.id);
                }
            });

            roots = orderRootsSmartly(roots);
            roots.forEach(rootId => { if (!renderedIds.has(rootId)) $('#tree-layer').append(renderChild(rootId, 0)); });

            // Catch-all: render any isolated branches or unparented females whose husbands are suppressed
            db.persons.forEach(p => {
                if (!renderedIds.has(p.id) && !suppressedIds.has(p.id)) {
                    if (p.gender === 'm' || !hasActiveMalePartner(p.id)) {
                        $('#tree-layer').append(renderChild(p.id, 0));
                    }
                }
            });

            if (currentViewMode === 'tree') setTimeout(drawLines, 10);
        }

        function drawLines() {
            const container = document.getElementById('tree-layer');
            if (container) {
                // Force the browser to flush layout so getBoundingClientRect() returns accurate positions.
                const _reflow = container.offsetHeight;
            }

            const svg = document.getElementById('svg-layer');
            const svgRings = document.getElementById('svg-layer-rings');
            let svgLinesHtml = '', svgOverlayHtml = '';
            const zcRect = document.getElementById('zoom-container').getBoundingClientRect();

            function getCenter(el) {
                const rect = el.getBoundingClientRect();
                return { x: (rect.left + rect.width / 2 - zcRect.left) / canvasZoom, y: (rect.top + rect.height / 2 - zcRect.top) / canvasZoom };
            }

            // Draw vertical partner links and marriage/relationship rings between spouses
            db.persons.forEach(p => {
                if (p.gender !== 'm') return;
                const maleEl = document.querySelector(`.person-node[data-id="${p.id}"]`);
                if (!maleEl) return;

                let hasDrawnRing = false;
                const mEvents = getDisplayEvents(p.id);

                getPartners(p.id).forEach(partnerId => {
                    const femaleEl = document.querySelector(`.person-node[data-id="${partnerId}"]`);
                    if (!femaleEl) return;

                    const mC = getCenter(maleEl);
                    const fC = getCenter(femaleEl);
                    const mBottom = (maleEl.getBoundingClientRect().bottom - zcRect.top) / canvasZoom;
                    const fTop = (femaleEl.getBoundingClientRect().top - zcRect.top) / canvasZoom;

                    const everMarried = mEvents.some(e => e.type === 'Marriage' && (e.involvedPersonId === partnerId || e.sourceId === partnerId));
                    const femaleIsMarried = getDisplayEvents(partnerId).some(e => e.type === 'Marriage');
                    const isSecondarySpouse = !everMarried && femaleIsMarried;
                    const strokeAttr = isSecondarySpouse ? `stroke-dasharray="4,4"` : ``;

                    svgLinesHtml += `<path class="tree-line" d="M ${mC.x - 3} ${mBottom} L ${fC.x - 3} ${fTop}" stroke="#9ca3af" stroke-width="2" ${strokeAttr}/>`;
                    svgLinesHtml += `<path class="tree-line" d="M ${mC.x + 3} ${mBottom} L ${fC.x + 3} ${fTop}" stroke="#9ca3af" stroke-width="2" ${strokeAttr}/>`;

                    if (!hasDrawnRing) {
                        const ringY = (mBottom + fTop) / 2;
                        if (everMarried) {
                            svgOverlayHtml += `<circle cx="${mC.x}" cy="${ringY}" r="12" fill="white" stroke="#d1d5db" stroke-width="1"/>`;
                            svgOverlayHtml += `<circle cx="${mC.x - 3.5}" cy="${ringY}" r="3.5" fill="none" stroke="#4b5563" stroke-width="1.5"/><circle cx="${mC.x + 3.5}" cy="${ringY}" r="3.5" fill="none" stroke="#4b5563" stroke-width="1.5"/>`;
                            hasDrawnRing = true;
                        } else if (!isSecondarySpouse) {
                            svgOverlayHtml += `<circle cx="${mC.x}" cy="${ringY}" r="12" fill="white" stroke="#d1d5db" stroke-width="1"/>`;
                            svgOverlayHtml += `<g transform="translate(${mC.x - 8}, ${ringY - 8}) scale(0.65)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#4b5563"/></g>`;
                            hasDrawnRing = true;
                        }
                    }
                });
            });

            // Draw curved bezier lines from parent group boxes to each child node
            db.persons.forEach(child => {
                let startParentId = child.fatherId || child.motherId || null;
                if (!startParentId) return;

                const parentNode = document.querySelector(`.person-node[data-id="${startParentId}"]`);
                if (!parentNode) return;
                const startBox = parentNode.closest('.parents-box');
                if (!startBox) return;
                const startBoxId = parseInt(startBox.getAttribute('data-id'), 10);

                if (collapsedFamilies.has(startBoxId)) return;

                let endEl = null;
                if (child.gender === 'm' || !hasActiveMalePartner(child.id)) {
                    const cNode = document.querySelector(`.person-node[data-id="${child.id}"]`);
                    if (cNode) endEl = cNode.closest('.parents-box');
                } else {
                    endEl = document.querySelector(`.person-node[data-id="${child.id}"]`);
                }

                if (startBox && endEl) {
                    const sRect = startBox.getBoundingClientRect();
                    const eRect = endEl.getBoundingClientRect();
                    const x1 = (sRect.right - zcRect.left) / canvasZoom;
                    const y1 = (sRect.top + sRect.height / 2 - zcRect.top) / canvasZoom;
                    const x2 = (eRect.left - zcRect.left) / canvasZoom;
                    const y2 = (eRect.top + eRect.height / 2 - zcRect.top) / canvasZoom;
                    const isGenSkip = child.gender === 'f' && hasActiveMalePartner(child.id);
                    const strokeAttr = isGenSkip ? 'stroke-dasharray="6,6" stroke="#9ca3af"' : 'stroke="#6b7280"';
                    const sw = isGenSkip ? 3 : 2;
                    const dist = Math.max(30, (x2 - x1) / 2);
                    svgLinesHtml += `<path class="tree-line" data-child="${child.id}" data-father="${child.fatherId || ''}" data-mother="${child.motherId || ''}" d="M ${x1} ${y1} C ${x1 + dist} ${y1}, ${x2 - dist} ${y2}, ${x2} ${y2}" fill="none" ${strokeAttr} stroke-width="${sw}" />`;
                }
            });

            svg.innerHTML = svgLinesHtml;
            svgRings.innerHTML = svgOverlayHtml;
            updateHighlight();
        }

        // --- PAN & DRAG ---
        let isDown = false, hasDragged = false, startX, startY, scrollLeft, scrollTop, clickStartX, clickStartY;
        const slider = document.getElementById('canvas-container');

        document.addEventListener('mousedown', () => { hasDragged = false; }, true);
        document.addEventListener('touchstart', () => { hasDragged = false; }, true);

        function startPan(e) {
            if ($(e.target).closest('#editor-panel, #action-bar, #burger-menu, #lang-dropdown-desktop, #empty-state, #map-container, .leaflet-popup, .collapse-toggle-btn, #search-results, #search-container').length) return;
            if (e.target === slider && (e.offsetX > slider.clientWidth || e.offsetY > slider.clientHeight)) return;
            const pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
            const pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
            clickStartX = pageX; clickStartY = pageY;
            isDown = true;
            slider.classList.add('grabbing-cursor');
            startX = pageX - slider.offsetLeft;
            startY = pageY - slider.offsetTop;
            scrollLeft = slider.scrollLeft;
            scrollTop = slider.scrollTop;
        }

        function endPan() { isDown = false; slider.classList.remove('grabbing-cursor'); }

        function movePan(e) {
            if (!isDown) return;
            const pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
            const pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
            if (Math.abs(pageX - clickStartX) > 5 || Math.abs(pageY - clickStartY) > 5) hasDragged = true;
            if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
            slider.scrollLeft = scrollLeft - (pageX - clickStartX);
            slider.scrollTop = scrollTop - (pageY - clickStartY);
        }

        document.addEventListener('mousedown', startPan);
        document.addEventListener('mousemove', movePan, { passive: false });
        document.addEventListener('mouseup', endPan);
        document.addEventListener('touchstart', startPan, { passive: true });
        document.addEventListener('touchmove', movePan, { passive: false });
        document.addEventListener('touchend', endPan);
        document.addEventListener('touchcancel', endPan);

        document.addEventListener('click', (e) => {
            if (hasDragged) { e.stopPropagation(); e.preventDefault(); hasDragged = false; return; }
            if (!$(e.target).closest('#burger-btn, #burger-menu, .import-file-replace, .import-file-merge').length) $('#burger-menu').addClass('hidden');
            if (!$(e.target).closest('#lang-dropdown-desktop').length) $('.lang-menu').addClass('hidden');
            if (!$(e.target).closest('.person-node, #editor-panel, #action-bar, #burger-menu, #lang-dropdown-desktop, .collapse-toggle-btn, #search-results').length) {
                if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
            }
        }, true);

        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement ? document.activeElement.tagName.toUpperCase() : '';
            const isInputActive = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !isInputActive) {
                if (e.shiftKey) redo(); else undo();
                e.preventDefault();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !isInputActive) {
                redo(); e.preventDefault();
            } else if (e.key === 'Delete' && selectedPersonId && !isInputActive) {
                $('#delete-person-btn').click();
            }
        });

        function updateHighlight() {
            $('.tree-line').removeClass('highlighted-line');
            if (selectedPersonId) {
                $(`.tree-line[data-child="${selectedPersonId}"]`).addClass('highlighted-line');
                $(`.tree-line[data-father="${selectedPersonId}"]`).addClass('highlighted-line');
                $(`.tree-line[data-mother="${selectedPersonId}"]`).addClass('highlighted-line');
            }
        }

        function openPanel(id) {
            selectedPersonId = parseInt(id, 10);
            const p = getPerson(selectedPersonId);
            if (!p) return;

            $('#edit-id').val(p.id);
            $('#edit-firstName').val(p.firstName);
            $('#edit-lastName').val(p.lastName || '');
            $('#edit-nickname').val(p.nickname || '');

            const activeCategory = p.category || 'none';
            $('#edit-category').val(activeCategory).css('background-color', activeCategory !== 'none' ? CATEGORY_COLORS[activeCategory] + '33' : '#ffffff');
            $('#edit-title').val(p.title || '');
            $('#edit-gender').val(p.gender);
            $('#edit-address').val(p.address || '');
            $('#edit-person-notes').val(p.notes || '');

            $('.gender-btn').removeClass('bg-blue-50 bg-pink-50 shadow-inner text-blue-600 text-pink-600').addClass('bg-white');
            if (p.gender === 'm') $('#gender-m-btn').removeClass('bg-white').addClass('bg-blue-50 shadow-inner text-blue-600');
            if (p.gender === 'f') $('#gender-f-btn').removeClass('bg-white').addClass('bg-pink-50 shadow-inner text-pink-600');

            const pBirthObj = getBirthDateObj(p.id);
            const currentMotherSpouses = p.motherId ? getPartners(p.motherId) : [];
            const currentFatherSpouses = p.fatherId ? getPartners(p.fatherId) : [];

            let popFatherOptions = `<option value="">${t('noFather')}</option>`;
            let popMotherOptions = `<option value="">${t('noMother')}</option>`;
            let childAssignOptions = `<option value="">${t('selectPerson')}</option>`;

            db.persons.forEach(op => {
                if (op.id === p.id) return;
                const opRoman = romanNumerals[op.id] ? ` ${romanNumerals[op.id]}` : '';
                const fullName = `${op.firstName} ${op.lastName || ''}${opRoman}`;
                const genderSym = op.gender === 'm' ? '♂' : '♀';
                const opBirthObj = getBirthDateObj(op.id);
                const isOlder = !(pBirthObj && opBirthObj && opBirthObj >= pBirthObj);
                const isYounger = !(pBirthObj && opBirthObj && opBirthObj <= pBirthObj);

                if (isOlder) {
                    if (op.gender === 'm') popFatherOptions += `<option value="${op.id}">${fullName}${currentMotherSpouses.includes(op.id) ? ' ⭐' : ''}</option>`;
                    if (op.gender === 'f') popMotherOptions += `<option value="${op.id}">${fullName}${currentFatherSpouses.includes(op.id) ? ' ⭐' : ''}</option>`;
                }
                if (op.fatherId !== p.id && op.motherId !== p.id && isYounger) {
                    childAssignOptions += `<option value="${op.id}">${genderSym} ${fullName}</option>`;
                }
            });

            $('#edit-father').html(popFatherOptions).val(p.fatherId || '');
            $('#edit-mother').html(popMotherOptions).val(p.motherId || '');
            $('#assign-child-select').html(childAssignOptions);

            renderEventsEditor(p.id);
            renderChildrenEditor(p.id);

            $('#editor-panel').removeClass('hidden').addClass('flex');
            $('.person-node').removeClass('ring-2 ring-blue-500 shadow-xl');
            $(`.person-node[data-id="${selectedPersonId}"]`).addClass('ring-2 ring-blue-500 shadow-xl');

            updateValidationUI(p);
            updateHighlight();
        }

        function renderChildrenEditor(parentId) {
            const children = sortChildren(db.persons.filter(c => c.fatherId === parentId || c.motherId === parentId));
            let html = '';
            children.forEach(c => {
                const cRoman = romanNumerals[c.id] ? ` <span class="text-gray-400">${romanNumerals[c.id]}</span>` : '';
                html += `
                <div class="flex justify-between items-center bg-gray-50 border px-1 rounded text-xs">
                    <div class="flex items-center gap-1.5 text-sm cursor-pointer person-link hover:text-blue-600 transition-colors" data-id="${c.id}">
                        ${c.gender === 'm' ? ICONS.male : ICONS.female}
                        <span class="font-bold">${c.firstName} ${c.lastName || ''}${cRoman}</span>
                    </div>
                    <button class="remove-child text-red-500 hover:text-red-700 font-bold p-1 rounded hover:bg-red-100 transition-colors" data-child-id="${c.id}" title="Remove Child">
                        <i class="ph ph-x text-sm"></i>
                    </button>
                </div>`;
            });
            if (children.length === 0) html = `<div class="text-xs text-gray-400 italic">${t('noChildren')}</div>`;
            $('#edit-children-list').html(html);
        }

        function renderEventsEditor(personId) {
            const events = getDisplayEvents(personId);

            const typeWeight = { 'Birth': 1, 'Marriage': 2, 'Death': 3 };
            events.sort((a, b) => {
                const wDiff = (typeWeight[a.type] || 4) - (typeWeight[b.type] || 4);
                if (wDiff !== 0) return wDiff;
                const dateDiff = parseDateForSort(a.date) - parseDateForSort(b.date);
                if (dateDiff !== 0) return dateDiff;
                return a.originalIndex - b.originalIndex;
            });

            // Pre-build person labels once — reused inside each Marriage event row (O(n) instead of O(n*m))
            const personOptionLabels = db.persons.map(op => {
                const opRoman = romanNumerals[op.id] ? ` ${romanNumerals[op.id]}` : '';
                const genderSym = op.gender === 'm' ? '♂' : '♀';
                return { id: op.id, label: `${genderSym} ${op.firstName} ${op.lastName || ''}${opRoman}` };
            });

            let html = '';
            events.forEach(e => {
                const partnerId = (e.sourceId !== personId) ? e.sourceId : e.involvedPersonId;
                const pOpts = `<option value="">${t('noPerson')}</option>` +
                    personOptionLabels.map(o => `<option value="${o.id}" ${partnerId === o.id ? 'selected' : ''}>${o.label}</option>`).join('');

                const isBorrowed = e.sourceId !== personId;
                const bgClass = isBorrowed ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-200';
                const borrowedBadge = isBorrowed ? `<span class="absolute top-0 left-2 text-[9px] font-bold text-blue-500 uppercase tracking-wider">Linked</span>` : '';

                let pickerVal = '';
                if (e.date && /^\d{2}\.\d{2}\.\d{4}$/.test(e.date)) {
                    const parts = e.date.split('.');
                    pickerVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }

                html += `
                <div class="border p-2 rounded flex flex-col gap-1.5 relative event-row shadow-sm ${bgClass}" data-source-id="${e.sourceId}" data-original-index="${e.originalIndex}">
                    ${borrowedBadge}
                    <button class="remove-event text-red-400 absolute top-1 right-1 font-bold text-xs hover:bg-red-100 p-1 rounded"><i class="ph ph-x text-sm"></i></button>
                    
                    <div class="flex gap-2 pr-6 ${isBorrowed ? 'mt-3' : ''}">
                        <select class="ev-type w-1/4 border rounded p-1 text-xs outline-none h-7" ${isBorrowed ? 'disabled' : ''}>
                            <option value="Birth" ${e.type === 'Birth' ? 'selected' : ''}>${t('birth')}</option>
                            <option value="Death" ${e.type === 'Death' ? 'selected' : ''}>${t('death')}</option>
                            <option value="Marriage" ${e.type === 'Marriage' ? 'selected' : ''}>${t('marriage')}</option>
                            <option value="Other" ${e.type === 'Other' ? 'selected' : ''}>${t('other')}</option>
                        </select>
                        <div class="relative w-1/4">
                            <input type="text" class="ev-date w-full border rounded p-1 pr-6 text-xs outline-none h-7 focus:ring focus:ring-blue-200 invalid:border-red-500 invalid:ring-1 invalid:ring-red-500" placeholder="${t('formatDate')}" value="${e.date || ''}" pattern="^(\\d{4}|\\d{2}\\.\\d{2}\\.\\d{4})?$" ${isBorrowed ? 'disabled' : ''} title="Format: YYYY or DD.MM.YYYY">
                            <input type="date" class="ev-date-picker absolute right-0 w-6 h-full opacity-0 cursor-pointer" value="${pickerVal}" ${isBorrowed ? 'disabled' : ''} onclick="this.showPicker && this.showPicker()">
                            <i class="ph ph-calendar-blank absolute right-1 top-1.5 pointer-events-none text-gray-500 text-sm"></i>
                        </div>
                        <input type="text" class="ev-place w-1/4 border rounded p-1 text-xs outline-none h-7" placeholder="${t('place')}" value="${e.place || ''}" ${isBorrowed ? 'disabled' : ''}>
                        <input type="text" class="ev-coords w-1/4 border rounded p-1 text-xs outline-none h-7" placeholder="${t('coords')}" value="${e.coordinates || ''}" ${isBorrowed ? 'disabled' : ''}>
                    </div>
                    
                    <div class="flex gap-2">
                        ${(e.type === 'Marriage') ? `<select class="ev-person w-1/3 border rounded p-1 text-xs outline-none h-7" ${isBorrowed ? 'disabled' : ''}>${pOpts}</select>` : ''}
                        <input type="text" class="ev-note flex-grow border rounded p-1 text-xs outline-none h-7 focus:ring focus:ring-blue-200" placeholder="${t('eventNotes')}" value="${e.note || ''}" ${isBorrowed ? 'disabled' : ''}>
                    </div>
                </div>`;
            });
            $('#events-list').html(html);
        }

        $(document).on('change', '.ev-date-picker', function() {
            const val = $(this).val();
            if (val) {
                const parts = val.split('-');
                $(this).siblings('.ev-date').val(`${parts[2]}.${parts[1]}.${parts[0]}`).trigger('change');
            }
        });

        // Handles live editing of all panel fields except event-specific inputs.
        $('#editor-panel').on('input change', 'input:not(.ev-date):not(.ev-place):not(.ev-coords):not(.ev-note):not(.ev-date-picker), select:not(.ev-type):not(.ev-person), textarea:not(.ev-note)', function(e) {
            if (this.id === 'edit-id' || this.id === 'assign-child-select' || this.id === 'quick-nav-select' || this.id === 'quick-nav-marriage') return;
            const id = parseInt($('#edit-id').val(), 10);
            if (!id) return;
            const p = getPerson(id);
            if (!p) return;

            const oldGender = p.gender;
            p.firstName = $('#edit-firstName').val();
            p.lastName = $('#edit-lastName').val();
            p.nickname = $('#edit-nickname').val();
            p.category = $('#edit-category').val();
            p.title = $('#edit-title').val();
            p.gender = $('#edit-gender').val();
            p.address = $('#edit-address').val();
            p.notes = $('#edit-person-notes').val();
            p.fatherId = $('#edit-father').val() ? parseInt($('#edit-father').val(), 10) : null;
            p.motherId = $('#edit-mother').val() ? parseInt($('#edit-mother').val(), 10) : null;

            updateValidationUI(p);

            if (this.id === 'edit-category') {
                $(this).css('background-color', p.category !== 'none' ? CATEGORY_COLORS[p.category] + '33' : '#ffffff');
            }

            // When gender changes, flip all partners and swap fatherId/motherId on children
            if (oldGender !== p.gender) {
                getPartners(p.id).forEach(partnerId => {
                    const partner = getPerson(partnerId);
                    if (partner) partner.gender = (p.gender === 'm') ? 'f' : 'm';
                });
                db.persons.filter(c => c.fatherId === p.id || c.motherId === p.id).forEach(c => {
                    if (c.fatherId === p.id) { c.fatherId = c.motherId; c.motherId = p.id; }
                    else if (c.motherId === p.id) { c.motherId = c.fatherId; c.fatherId = p.id; }
                });
                saveData(false);
                openPanel(p.id);
                return;
            }

            if (this.tagName === 'SELECT' && e.type === 'change') {
                debouncedSaveData();
            } else if (this.tagName !== 'SELECT') {
                // For text inputs: update card DOM in-place (faster than full re-render) and persist to localStorage
                localStorage.setItem('genealogyData_' + currentDbName, JSON.stringify(db));
                updateRomanNumerals();

                const roman = romanNumerals[p.id] ? `<span class="text-gray-400 ml-1">${romanNumerals[p.id]}</span>` : '';
                const titleSpanAttr = p.title ? `title="${p.title.replace(/"/g, '&quot;')}"` : '';
                const fullNameAttr = `${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} ${p.lastName || ''} ${romanNumerals[p.id] || ''}`.trim().replace(/\s+/g, ' ').replace(/"/g, '&quot;');

                const $node = $(`.person-node[data-id="${p.id}"]`);
                const $titleEl = $node.find('span.text-\\[10px\\]');
                $titleEl.html(p.title || '');
                if (p.title) $titleEl.attr('title', p.title.replace(/"/g, '&quot;'));
                else $titleEl.removeAttr('title');

                $node.find('.font-bold.text-gray-800').attr('title', fullNameAttr).html(`${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} <span class="uppercase">${p.lastName || ''}</span>${roman}`);
                $node.find('.flex-shrink-0.flex.items-center.ml-1').html(`${buildWarningHtml(p)}${p.gender === 'm' ? ICONS.male : ICONS.female}`);

                // Rebuild and inject the extra info section
                const extraInfoHtml = buildExtraInfoHtml(p);
                $node.find('.events-container').nextAll('div:not(.action-buttons)').remove();
                if (extraInfoHtml) $node.find('.p-1.pb-1\\.5').append(extraInfoHtml);

                $node.css({ 'border-left': `6px solid ${getColor(p.lastName)}`, 'background-color': (p.category && p.category !== 'none' && CATEGORY_COLORS[p.category]) ? (CATEGORY_COLORS[p.category] + '33') : '#ffffff' });

                if (e.type === 'change') debouncedSaveData();
            }
        });

        $('#editor-panel').on('input change', '.ev-type, .ev-date, .ev-place, .ev-coords, .ev-person, .ev-note', function(e) {
            const row = $(this).closest('.event-row');
            const sId = parseInt(row.attr('data-source-id'), 10);
            const idx = parseInt(row.attr('data-original-index'), 10);
            const sourcePerson = getPerson(sId);
            if (!sourcePerson || !sourcePerson.events[idx]) return;

            const ev = sourcePerson.events[idx];
            const dateVal = row.find('.ev-date').val().trim();
            if (dateVal !== "" && !/^(\d{4}|\d{2}\.\d{2}\.\d{4})$/.test(dateVal)) return;

            ev.type = row.find('.ev-type').val();
            ev.date = dateVal;
            ev.place = row.find('.ev-place').val();
            ev.coordinates = row.find('.ev-coords').val();
            const invId = row.find('.ev-person').val();
            ev.involvedPersonId = invId ? parseInt(invId, 10) : null;
            ev.note = row.find('.ev-note').val();

            // Type/person changes need a full re-render; other changes only update the card's events row
            if (e.type === 'change' && ($(this).hasClass('ev-type') || $(this).hasClass('ev-person'))) {
                clearTimeout(debounceSaveTimeout);
                debounceSaveTimeout = setTimeout(() => {
                    saveData();
                    renderEventsEditor(selectedPersonId);
                }, 200);
            } else {
                localStorage.setItem('genealogyData_' + currentDbName, JSON.stringify(db));
                $(`.person-node[data-id="${selectedPersonId}"]`).find('.events-container').html(buildEventsHtml(selectedPersonId));
                if (ev.involvedPersonId) $(`.person-node[data-id="${ev.involvedPersonId}"]`).find('.events-container').html(buildEventsHtml(ev.involvedPersonId));
                if (e.type === 'change' && !($(this).hasClass('ev-type') || $(this).hasClass('ev-person'))) debouncedSaveData();
            }
        });

        $('#add-event-btn').click(() => {
            const id = parseInt($('#edit-id').val(), 10);
            const p = getPerson(id);
            if (!p) return;
            if (!p.events) p.events = [];
            p.events.push({ type: 'Other', date: '' });
            renderEventsEditor(id);
            saveData();
        });

        $(document).on('click', '.remove-event', function() {
            const row = $(this).closest('.event-row');
            const sId = parseInt(row.attr('data-source-id'), 10);
            const idx = parseInt(row.attr('data-original-index'), 10);
            const p = getPerson(sId);
            if (p && p.events) {
                p.events.splice(idx, 1);
                saveData();
                renderEventsEditor(selectedPersonId);
            }
        });

        $('#create-first-person-btn').click(() => {
            db.persons = [{ id: 1, firstName: "New", lastName: "Person", gender: "m", events: [] }];
            saveData();
            openPanel(1);
            const el = document.getElementById('canvas-container');
            el.scrollLeft = 25000 - window.innerWidth / 2 + 128;
            el.scrollTop = 25000 - window.innerHeight / 2 + 100;
        });

        $('#create-child-btn').click(() => {
            const parentId = parseInt($('#edit-id').val(), 10);
            const parent = getPerson(parentId);
            const newId = getNextId();
            const newChild = { id: newId, firstName: "New", lastName: parent.lastName, gender: "m", events: [] };
            const partners = getPartners(parentId);
            if (parent.gender === 'm') { newChild.fatherId = parentId; if (partners.length > 0) newChild.motherId = partners[0]; }
            else { newChild.motherId = parentId; if (partners.length > 0) newChild.fatherId = partners[0]; }
            db.persons.push(newChild);
            saveData();
            openPanel(parentId);
        });

        $('#assign-child-btn').click(() => {
            const childId = parseInt($('#assign-child-select').val(), 10);
            if (!childId) return;
            const parentId = parseInt($('#edit-id').val(), 10);
            const parent = getPerson(parentId);
            const child = getPerson(childId);
            if (parent.gender === 'm') child.fatherId = parentId; else child.motherId = parentId;
            saveData();
            openPanel(parentId);
        });

        $(document).on('click', '.remove-child', function() {
            const childId = parseInt($(this).data('child-id'), 10);
            const parentId = parseInt($('#edit-id').val(), 10);
            const parent = getPerson(parentId);
            const child = getPerson(childId);
            if (parent.gender === 'm') child.fatherId = null; else child.motherId = null;
            saveData();
            openPanel(parentId);
        });

        $(document).on('click', '.person-link', function(e) {
            e.stopPropagation();
            const id = parseInt($(this).data('id'), 10);
            openPanel(id);
            if (currentViewMode === 'tree') scrollToPerson(id);
        });

        $('#close-panel').click(() => {
            $('#editor-panel').removeClass('flex').addClass('hidden');
            selectedPersonId = null;
            $('.person-node').removeClass('ring-2 ring-blue-500 shadow-xl');
            updateHighlight();
        });

        $(document).on('click', '.person-node', function(e) {
            if ($(e.target).closest('.action-buttons').length) return;
            openPanel($(this).data('id'));
        });

        $(document).on('click', '.action-father', function(e) {
            e.stopPropagation();
            const childId = parseInt($(this).closest('.person-node').data('id'), 10);
            const child = getPerson(childId);
            if (child.fatherId) { openPanel(child.fatherId); return; }
            const newId = getNextId();
            db.persons.push({ id: newId, firstName: "New", lastName: child.lastName, gender: "m", events: [] });
            child.fatherId = newId;
            saveData();
            openPanel(newId);
        });

        $(document).on('click', '.action-mother', function(e) {
            e.stopPropagation();
            const childId = parseInt($(this).closest('.person-node').data('id'), 10);
            const child = getPerson(childId);
            if (child.motherId) { openPanel(child.motherId); return; }
            const newId = getNextId();
            db.persons.push({ id: newId, firstName: "New", lastName: child.lastName, gender: "f", events: [] });
            child.motherId = newId;
            saveData();
            openPanel(newId);
        });

        $(document).on('click', '.action-spouse', function(e) {
            e.stopPropagation();
            const personId = parseInt($(this).closest('.person-node').data('id'), 10);
            const person = getPerson(personId);
            const newId = getNextId();
            db.persons.push({ id: newId, firstName: "New", lastName: "", gender: person.gender === 'm' ? 'f' : 'm', events: [] });
            if (!person.events) person.events = [];
            person.events.push({ type: 'Marriage', date: '', place: '', involvedPersonId: newId, note: '' });
            saveData();
            openPanel(newId);
        });

        $(document).on('click', '.action-child', function(e) {
            e.stopPropagation();
            const parentId = parseInt($(this).closest('.person-node').data('id'), 10);
            const parent = getPerson(parentId);
            const newId = getNextId();
            const newChild = { id: newId, firstName: "New", lastName: parent.lastName, gender: "m", events: [] };
            const partners = getPartners(parentId);
            if (parent.gender === 'm') { newChild.fatherId = parentId; if (partners.length > 0) newChild.motherId = partners[0]; }
            else { newChild.motherId = parentId; if (partners.length > 0) newChild.fatherId = partners[0]; }
            db.persons.push(newChild);
            saveData();
            openPanel(newId);
        });

        $('#delete-person-btn').click(() => {
            const id = parseInt($('#edit-id').val(), 10);
            if (confirm(t('confirmDelete'))) {
                db.persons = db.persons.filter(p => p.id !== id);
                db.persons.forEach(p => {
                    if (p.fatherId === id) p.fatherId = null;
                    if (p.motherId === id) p.motherId = null;
                    if (p.events) p.events = p.events.filter(e => e.involvedPersonId !== id);
                });
                $('#close-panel').click();
                saveData();
            }
        });

        // Re-sequence IDs starting from 1 with no gaps before exporting.
        function getExportData() {
            const exportDb = JSON.parse(JSON.stringify(db));
            const idMap = {};
            let newId = 1;
            exportDb.persons.forEach(p => { idMap[p.id] = newId++; });
            exportDb.persons.forEach(p => {
                p.id = idMap[p.id];
                if (p.fatherId) p.fatherId = idMap[p.fatherId] || null;
                if (p.motherId) p.motherId = idMap[p.motherId] || null;
                if (p.events) p.events.forEach(e => { if (e.involvedPersonId) e.involvedPersonId = idMap[e.involvedPersonId] || null; });
            });
            return exportDb;
        }

        // Shared helper: triggers a browser file download from a Blob.
        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        $('.export-json-btn').click(() => {
            $('#burger-menu').addClass('hidden');
            triggerDownload(new Blob([JSON.stringify(getExportData(), null, 2)], { type: "application/json" }), `genealogy_${currentDbName}.json`);
        });

        $('.export-zip-btn').click(async () => {
            $('#burger-menu').addClass('hidden');
            try {
                const stream = new Blob([JSON.stringify(getExportData())], { type: 'application/json' }).stream();
                const blob = await new Response(stream.pipeThrough(new CompressionStream('gzip'))).blob();
                triggerDownload(blob, `genealogy_${currentDbName}.json.gz`);
            } catch (err) { alert("Your browser does not support the Compression Streams API yet."); }
        });

        // Shared helper: reads a .json or .gz file and returns the parsed object.
        async function readImportFile(file) {
            const view = new Uint8Array(await file.slice(0, 2).arrayBuffer());
            const isGzip = view.length === 2 && view[0] === 0x1F && view[1] === 0x8B;
            let stream = file.stream();
            if (isGzip) stream = stream.pipeThrough(new DecompressionStream('gzip'));
            return JSON.parse(await new Response(stream).text());
        }

        $('.import-file-replace').change(async function(e) {
            $('#burger-menu').addClass('hidden');
            const file = e.target.files[0];
            if (!file) return;
            try {
                const importedDb = await readImportFile(file);
                if (importedDb && Array.isArray(importedDb.persons)) {
                    $('#canvas-container').css('opacity', '0');
                    db = importedDb;
                    if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
                    collapsedFamilies.clear();
                    saveData(true);
                    refreshViewAfterLoad();
                } else alert("Invalid data format. Expected an array of persons.");
            } catch (err) { alert("Failed to import data. Please ensure it is a valid JSON or GZIP file."); }
            $(this).val('');
        });

        $('.import-file-merge').change(async function(e) {
            $('#burger-menu').addClass('hidden');
            const file = e.target.files[0];
            if (!file) return;
            try {
                const importedDb = await readImportFile(file);
                if (importedDb && Array.isArray(importedDb.persons)) {
                    $('#canvas-container').css('opacity', '0');

                    // Assign new sequential IDs above the current maximum to avoid collisions
                    let maxId = db.persons.reduce((m, p) => Math.max(m, p.id), 0);
                    const idMap = {};
                    importedDb.persons.forEach(ip => { idMap[ip.id] = ++maxId; ip.id = maxId; });

                    // Remap all relational references using the new ID mapping
                    importedDb.persons.forEach(ip => {
                        if (ip.fatherId) ip.fatherId = idMap[ip.fatherId] || null;
                        if (ip.motherId) ip.motherId = idMap[ip.motherId] || null;
                        if (ip.events) ip.events.forEach(ev => { if (ev.involvedPersonId) ev.involvedPersonId = idMap[ev.involvedPersonId] || null; });
                        db.persons.push(ip);
                    });

                    if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
                    saveData(true);
                    refreshViewAfterLoad();
                } else alert("Invalid data format. Expected an array of persons.");
            } catch (err) { alert("Failed to merge data. Please ensure it is a valid JSON or GZIP file."); }
            $(this).val('');
        });

        window.addEventListener('resize', () => { if (currentViewMode === 'tree') drawLines(); });

        // INITIALIZE ALL
        loadDBList();
        updateRomanNumerals();
        updateLanguageUI();

        // Let everything build, then fade out the loader overlay and reveal the UI.
        setTimeout(() => {
            if (currentViewMode === 'tree') {
                drawLines();
                centerOnLargestFamily();
            }

            $('#app-loading').addClass('opacity-0 pointer-events-none');
            $('#action-bar').removeClass('opacity-0 pointer-events-none');
            if (currentViewMode === 'tree') $('#canvas-container').removeClass('hidden opacity-0');
            else $('#map-container').removeClass('hidden');

            setTimeout(() => { $('#app-loading').remove(); }, 300);
        }, 100);

    </script>
</body>
</html>
