<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Free, open-source, and minimal genealogy tool designed to help you build, organize, and research your family tree.">
    <meta name="keywords" content="genealogy">
    <meta name="author" content="Niklas Jank">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Legacy</title>
    <link rel="icon" type="image/svg+xml" href="tree-structure-duotone.svg">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .grab-cursor { cursor: grab; }
        .grabbing-cursor { cursor: grabbing !important; }

        #canvas-container { touch-action: none; }
        
        #zoom-container { transform-origin: top left; }

        svg path, svg circle { transition: stroke 0.3s, stroke-width 0.3s; }
        .highlighted-line { stroke: #3b82f6 !important; stroke-width: 4px !important; z-index: 100; }

        .leaflet-popup-content { margin: 8px 10px; }
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden text-sm select-none h-[100dvh] w-screen relative">
    
    <!-- Initial Full-Screen App Loader -->
    <div id="app-loading" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-gray-100 transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
        <div class="mt-4 text-gray-500 font-bold text-sm tracking-widest">
            <span data-i18n="loading">LOADING...</span> <span id="app-loading-pct"></span>
        </div>
    </div>

    <div id="app" class="flex h-[100dvh] w-screen relative">

        <!-- Action Bar -->
        <div id="action-bar" class="opacity-0 pointer-events-none absolute bottom-0 left-0 w-full sm:w-auto sm:bottom-4 sm:left-4 z-40 flex items-center px-3 py-2 sm:p-0 bg-white/95 sm:bg-transparent shadow-[0_-4px_10px_rgba(0,0,0,0.05)] sm:shadow-none border-t border-gray-200 sm:border-none backdrop-blur sm:backdrop-blur-none pb-safe gap-2 overflow-x-auto hide-scrollbar sm:overflow-visible transition-opacity duration-300">
            
            <!-- Burger Button (Always visible) -->
            <button id="burger-btn" class="flex-shrink-0 bg-white border border-gray-300 text-gray-700 h-8 sm:h-7 w-8 sm:w-7 rounded shadow-sm hover:bg-gray-50 flex items-center justify-center transition-colors relative">
                <i class="ph ph-list text-lg"></i>
            </button>

            <!-- Global Search Box -->
            <div id="search-container" class="relative flex-shrink-0 flex items-center">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="global-search" class="w-32 sm:w-48 bg-white border border-gray-300 text-gray-700 pl-7 pr-2 py-0 h-8 sm:h-7 rounded shadow-sm text-[11px] font-bold outline-none focus:ring focus:ring-blue-200 transition-all placeholder-gray-400" placeholder="Search..." data-i18n-placeholder="search">
                </div>
                <!-- Search Results Dropdown -->
                <div id="search-results" class="absolute bottom-full left-0 mb-1 w-[280px] max-h-64 overflow-y-auto bg-white border border-gray-200 rounded shadow-lg hidden z-[100] flex-col hide-scrollbar">
                </div>
            </div>
            
            <div class="w-px bg-gray-300 mx-0.5 h-5 flex-shrink-0"></div>
            
            <!-- Undo/Redo Group -->
            <div class="flex rounded shadow-sm flex-shrink-0">
                <button id="undo-btn" class="px-2.5 sm:px-2 py-0 h-8 sm:h-7 text-xs font-bold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 rounded-l flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled data-i18n-title="undo">
                    <i class="ph ph-arrow-counter-clockwise text-lg text-gray-500"></i>
                </button>
                <button id="redo-btn" class="px-2.5 sm:px-2 py-0 h-8 sm:h-7 text-xs font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 rounded-r flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled data-i18n-title="redo">
                    <i class="ph ph-arrow-clockwise text-lg text-gray-500"></i>
                </button>
            </div>

            <!-- View Mode Switcher Group -->
            <div class="flex rounded shadow-sm flex-shrink-0 ml-1">
                <button class="mode-tree-btn px-2.5 py-0 h-8 sm:h-7 text-xs font-bold border border-gray-300 bg-blue-50 text-blue-600 shadow-inner rounded-l flex items-center gap-1 transition-colors">
                    <i class="ph ph-tree-structure text-lg"></i> <span class="hidden sm:inline" data-i18n="tree">Tree</span>
                </button>
                <button class="mode-map-btn px-2.5 py-0 h-8 sm:h-7 text-xs font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 rounded-r flex items-center gap-1 transition-colors">
                    <i class="ph ph-map-pin text-lg text-orange-500"></i> <span class="hidden sm:inline" data-i18n="map">Map</span>
                </button>
            </div>

            <!-- Zoom Group (Visible Desktop Only >= 768px) -->
            <div class="hidden md:flex rounded shadow-sm flex-shrink-0 ml-1">
                <button class="zoom-out-btn px-2 py-0 h-7 text-xs font-bold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 rounded-l flex items-center transition-colors">
                    <i class="ph ph-magnifying-glass-minus text-base"></i>
                </button>
                <button class="zoom-reset-btn px-2 py-0 h-7 text-[11px] font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 flex items-center transition-colors min-w-[42px] justify-center">
                    100%
                </button>
                <button class="zoom-in-btn px-2 py-0 h-7 text-xs font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 rounded-r flex items-center transition-colors">
                    <i class="ph ph-magnifying-glass-plus text-base"></i>
                </button>
            </div>

            <!-- Database Group (Desktop Only >= 1024px) -->
            <div class="hidden lg:flex items-center rounded shadow-sm flex-shrink-0 ml-1 bg-white border border-gray-300 h-7 text-[11px] font-bold">
                <span class="px-2 text-gray-500 border-r border-gray-300 h-full flex items-center bg-gray-50" title="Database" data-i18n-title="dbGroup">
                    <i class="ph ph-database text-[13px]"></i>
                </span>
                <select id="db-select" class="bg-transparent text-gray-700 px-2 py-0 h-full outline-none cursor-pointer w-[100px]"></select>
                <button id="db-create-btn" class="px-2 border-l border-gray-300 hover:bg-gray-50 h-full text-green-600 transition-colors" data-i18n-title="dbCreate"><i class="ph ph-plus"></i></button>
                <button id="db-delete-btn" class="px-2 border-l border-gray-300 hover:bg-gray-50 h-full text-red-600 transition-colors" data-i18n-title="dbDelete"><i class="ph ph-trash"></i></button>
            </div>

            <!-- Info Toggle Group (Desktop Only >= 1280px) -->
            <div class="hidden xl:flex rounded shadow-sm flex-shrink-0 ml-1">
                <button class="info-toggle-btn px-2 py-0 h-7 text-base font-bold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 rounded-l transition-colors" data-mode="events" data-i18n-title="events"><i class="ph ph-calendar-star"></i></button>
                <button class="info-toggle-btn px-2 py-0 h-7 text-base font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 transition-colors" data-mode="address" data-i18n-title="address"><i class="ph ph-address-book"></i></button>
                <button class="info-toggle-btn px-2 py-0 h-7 text-base font-bold border border-gray-300 border-l-0 bg-white text-gray-700 hover:bg-gray-50 transition-colors" data-mode="notes" data-i18n-title="notes"><i class="ph ph-notepad"></i></button>
                <button class="info-toggle-btn px-2 py-0 h-7 text-base font-bold border border-gray-300 border-l-0 bg-blue-50 text-blue-600 shadow-inner rounded-r transition-colors" data-mode="actions" data-i18n-title="actions"><i class="ph ph-user-gear"></i></button>
            </div>

            <!-- Desktop Language Dropdown (Desktop Only >= 1280px) -->
            <div class="hidden xl:flex relative rounded shadow-sm flex-shrink-0 ml-1" id="lang-dropdown-desktop">
                <button class="lang-toggle bg-white border border-gray-300 text-gray-700 px-2 py-0 h-7 rounded shadow-sm hover:bg-gray-50 flex items-center gap-1.5 text-[11px] font-bold outline-none cursor-pointer transition-colors">
                    <span class="lang-flag flex-shrink-0"></span> <span class="lang-label">EN</span> <i class="ph ph-caret-up text-gray-400"></i>
                </button>
                <div class="lang-menu absolute right-0 bottom-full mb-1 min-w-max bg-white border border-gray-200 rounded shadow-lg hidden flex-col overflow-hidden z-[100]">
                    <button class="lang-option px-2 py-1.5 text-left text-[11px] font-bold hover:bg-gray-50 flex items-center gap-1.5 border-b border-gray-100 transition-colors" data-lang="en">
                        <span class="flex-shrink-0 flex items-center justify-center w-[18px] h-[12px]"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" class="w-[18px] h-[12px] rounded-[2px] object-cover border border-gray-200"><clipPath id="a"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="b"><path d="M30 15h30v15zv15H0zH0V0zv15h30z"/></clipPath><g clip-path="url(#a)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#b)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg></span> EN
                    </button>
                    <button class="lang-option px-2 py-1.5 text-left text-[11px] font-bold hover:bg-gray-50 flex items-center gap-1.5 transition-colors" data-lang="de">
                        <span class="flex-shrink-0 flex items-center justify-center w-[18px] h-[12px]"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice" class="w-[18px] h-[12px] rounded-[2px] object-cover border border-gray-200"><rect width="3" height="2" fill="#000"/><rect width="3" height="1.33" y=".67" fill="#d00"/><rect width="3" height=".67" y="1.33" fill="#ffce00"/></svg></span> DE
                    </button>
                </div>
            </div>

        </div>

        <!-- Burger Menu Container -->
        <div id="burger-menu" class="fixed bottom-16 sm:bottom-12 left-3 w-56 bg-white border border-gray-200 rounded-lg shadow-xl hidden flex-col overflow-hidden z-[100]">
            <!-- Navs (Always inside menu) -->
            <div class="p-2 border-b border-gray-100 flex flex-col gap-2 bg-gray-50">
                <select class="quick-nav-person w-full bg-white border border-gray-300 text-gray-700 px-2 py-0 h-7 rounded shadow-sm text-[11px] font-bold outline-none cursor-pointer">
                </select>
                <select class="quick-nav-marriage w-full bg-white border border-gray-300 text-gray-700 px-2 py-0 h-7 rounded shadow-sm text-[11px] font-bold outline-none cursor-pointer">
                </select>
            </div>
            
            <!-- Database (Visible < 1024px inside menu) -->
            <div class="bg-gray-50 border-b border-gray-100 p-2 flex flex-col gap-1 lg:hidden">
                <span class="text-[11px] font-bold text-gray-500 px-1" data-i18n="dbGroup">Database</span>
                <div class="flex gap-1">
                    <select id="burger-db-select" class="flex-1 bg-white border border-gray-300 text-gray-700 px-2 py-1 rounded shadow-sm text-[11px] font-bold outline-none cursor-pointer"></select>
                    <button id="burger-db-create-btn" class="bg-white border border-gray-300 rounded px-2 text-green-600 hover:bg-gray-50" data-i18n-title="dbCreate"><i class="ph ph-plus"></i></button>
                    <button id="burger-db-delete-btn" class="bg-white border border-gray-300 rounded px-2 text-red-600 hover:bg-gray-50" data-i18n-title="dbDelete"><i class="ph ph-trash"></i></button>
                </div>
            </div>

            <!-- View Info (Visible < 1280px) -->
            <div class="bg-gray-50 border-b border-gray-100 p-2 grid grid-cols-4 gap-1 xl:hidden">
                <button class="info-toggle-btn text-base font-bold border border-gray-300 bg-white text-gray-700 rounded py-1 hover:bg-gray-100 transition-colors flex justify-center items-center" data-mode="events" data-i18n-title="events"><i class="ph ph-calendar-star"></i></button>
                <button class="info-toggle-btn text-base font-bold border border-gray-300 bg-white text-gray-700 rounded py-1 hover:bg-gray-100 transition-colors flex justify-center items-center" data-mode="address" data-i18n-title="address"><i class="ph ph-address-book"></i></button>
                <button class="info-toggle-btn text-base font-bold border border-gray-300 bg-white text-gray-700 rounded py-1 hover:bg-gray-100 transition-colors flex justify-center items-center" data-mode="notes" data-i18n-title="notes"><i class="ph ph-notepad"></i></button>
                <button class="info-toggle-btn text-base font-bold border border-gray-300 bg-blue-50 text-blue-600 shadow-inner rounded py-1 hover:bg-gray-100 transition-colors flex justify-center items-center" data-mode="actions" data-i18n-title="actions"><i class="ph ph-user-gear"></i></button>
            </div>

            <!-- Zoom (Visible < 768px) -->
            <div class="bg-white border-b border-gray-100 p-2 flex justify-between gap-1 md:hidden">
                <button class="zoom-out-btn flex-1 bg-white border border-gray-300 rounded py-1 flex justify-center hover:bg-gray-100"><i class="ph ph-magnifying-glass-minus"></i></button>
                <button class="zoom-reset-btn flex-1 bg-white border border-gray-300 rounded flex justify-center text-[11px] hover:bg-gray-100">100%</button>
                <button class="zoom-in-btn flex-1 bg-white border border-gray-300 rounded py-1 flex justify-center hover:bg-gray-100"><i class="ph ph-magnifying-glass-plus"></i></button>
            </div>

            <!-- Import/Export (Always in Menu) -->
            <button class="export-json-btn w-full text-left px-3 py-2.5 hover:bg-gray-50 text-xs font-bold border-b border-gray-100 flex items-center gap-2"><i class="ph ph-file-text text-blue-500 text-lg"></i> <span data-i18n="exportJson">JSON</span></button>
            <button class="export-zip-btn w-full text-left px-3 py-2.5 hover:bg-gray-50 text-xs font-bold border-b border-gray-100 flex items-center gap-2"><i class="ph ph-file-archive text-purple-500 text-lg"></i> <span data-i18n="exportZip">ZIP</span></button>
            <label class="w-full text-left px-3 py-2.5 hover:bg-gray-50 text-xs font-bold cursor-pointer flex items-center gap-2 m-0 border-b border-gray-100"><i class="ph ph-upload-simple text-red-500 text-lg"></i> <span data-i18n="importReplace">Import (Replace)</span> <input type="file" class="import-file-replace hidden" accept=".json,.gz"></label>
            <label class="w-full text-left px-3 py-2.5 hover:bg-gray-50 text-xs font-bold cursor-pointer flex items-center gap-2 m-0"><i class="ph ph-upload-simple text-green-500 text-lg"></i> <span data-i18n="importMerge">Import (Merge)</span> <input type="file" class="import-file-merge hidden" accept=".json,.gz"></label>

            <!-- Language (Visible < 1280px) -->
            <div class="bg-white border-b border-gray-100 p-2 flex flex-col gap-1 xl:hidden">
                <span class="text-[11px] font-bold text-gray-500 px-1" data-i18n="language">Language</span>
                <div class="flex gap-1">
                    <button class="lang-option flex-1 bg-white border border-gray-300 rounded py-1 flex justify-center items-center gap-1.5 text-[11px] font-bold hover:bg-gray-50 transition-colors" data-lang="en">
                        <span class="flex-shrink-0 flex items-center justify-center w-[18px] h-[12px]"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" class="w-[18px] h-[12px] rounded-[2px] object-cover border border-gray-200"><clipPath id="a"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="b"><path d="M30 15h30v15zv15H0zH0V0zv15h30z"/></clipPath><g clip-path="url(#a)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#b)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg></span> EN
                    </button>
                    <button class="lang-option flex-1 bg-white border border-gray-300 rounded py-1 flex justify-center items-center gap-1.5 text-[11px] font-bold hover:bg-gray-50 transition-colors" data-lang="de">
                        <span class="flex-shrink-0 flex items-center justify-center w-[18px] h-[12px]"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice" class="w-[18px] h-[12px] rounded-[2px] object-cover border border-gray-200"><rect width="3" height="2" fill="#000"/><rect width="3" height="1.33" y=".67" fill="#d00"/><rect width="3" height=".67" y="1.33" fill="#ffce00"/></svg></span> DE
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State Overlay -->
        <div id="empty-state" class="absolute inset-0 flex items-center justify-center bg-gray-100 z-30 hidden">
            <button id="create-first-person-btn" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow hover:bg-blue-700 font-bold flex items-center gap-2 transition-transform transform active:scale-95 text-base">
                <i class="ph ph-user-plus text-xl"></i> <span data-i18n="createPerson">Create Person</span>
            </button>
        </div>

        <!-- Map Container (Flex-Item) -->
        <div id="map-container" class="flex-grow relative z-20 hidden bg-gray-100 pb-16 sm:pb-0">
            <!-- Map loading overlay -->
            <div id="map-loading" class="absolute inset-0 z-30 bg-gray-100/80 flex flex-col items-center justify-center hidden">
                <div class="animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent"></div>
                <div class="mt-4 text-gray-600 font-bold text-sm tracking-widest">
                    <span data-i18n="loading">LOADING...</span> <span id="map-loading-pct"></span>
                </div>
            </div>
            <div id="map-element" class="w-full h-full z-0"></div>
        </div>

        <!-- Main Canvas (Scrollable Flex-Item) -->
        <div id="canvas-container" class="flex-grow overflow-auto relative grab-cursor pb-16 sm:pb-0 hidden opacity-0 transition-opacity duration-300">
            <div id="zoom-container" class="relative" style="width: 50000px; height: 50000px; transform-origin: top left;">
                <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-visible" style="z-index: 5;"></svg>
                <div id="tree-layer" class="absolute pointer-events-auto flex flex-col gap-8" style="top: 25000px; left: 25000px; z-index: 10;"></div>
                <svg id="svg-layer-rings" class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-visible" style="z-index: 15;"></svg>
            </div>
        </div>

        <!-- Edit Panel -->
        <div id="editor-panel" class="absolute inset-0 sm:relative sm:w-[450px] md:w-[500px] w-full flex-shrink-0 bg-white sm:border-l border-gray-300 shadow-2xl hidden flex-col z-50 h-[100dvh] sm:h-auto transform transition-transform duration-300 ease-in-out">
            <div class="p-1 border-b flex justify-between items-center z-10 flex-shrink-0 bg-gray-50">
                <h2 class="text-base font-bold text-gray-700 ml-1" data-i18n="editPerson">Edit Person</h2>
                <button id="close-panel" class="text-gray-400 hover:text-gray-700 p-1.5 rounded hover:bg-gray-200 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="p-2 sm:p-2 flex flex-col gap-4 flex-grow overflow-y-auto hide-scrollbar pb-24 sm:pb-5">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="col-span-1">
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1" data-i18n="title">Title</label>
                        <input type="text" id="edit-title" class="w-full border rounded p-1 text-xs outline-none h-7 focus:ring focus:ring-blue-200">
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1" data-i18n="gender">Gender *</label>
                        <div class="flex h-7 rounded shadow-sm w-full">
                            <button type="button" id="gender-m-btn" class="gender-btn flex-1 border border-gray-300 rounded-l flex items-center justify-center transition-colors bg-white text-blue-500" data-val="m"><i class="ph ph-gender-male text-base font-bold"></i></button>
                            <button type="button" id="gender-f-btn" class="gender-btn flex-1 border border-gray-300 border-l-0 rounded-r flex items-center justify-center transition-colors bg-white text-pink-500" data-val="f"><i class="ph ph-gender-female text-base font-bold"></i></button>
                        </div>
                        <input type="hidden" id="edit-gender" value="m">
                    </div>
                    <div class="col-span-1 sm:col-span-1">
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1" data-i18n="nickname">Nickname</label>
                        <input type="text" id="edit-nickname" class="w-full border rounded p-1 text-xs outline-none h-7 focus:ring focus:ring-blue-200">
                    </div>
                    <div class="col-span-1 sm:col-span-1">
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1" data-i18n="category">Category</label>
                        <select id="edit-category" class="w-full border rounded p-1 text-xs outline-none h-7 focus:ring focus:ring-blue-200 cursor-pointer">
                            <option value="none" data-i18n="catNone">None</option>
                            <option value="red" data-i18n="catRed" style="background-color: #ef444433;">Red</option>
                            <option value="orange" data-i18n="catOrange" style="background-color: #f9731633;">Orange</option>
                            <option value="yellow" data-i18n="catYellow" style="background-color: #eab30833;">Yellow</option>
                            <option value="chartreuse" data-i18n="catChartreuse" style="background-color: #84cc1633;">Chartreuse</option>
                            <option value="green" data-i18n="catGreen" style="background-color: #22c55e33;">Green</option>
                            <option value="springgreen" data-i18n="catSpringGreen" style="background-color: #10b98133;">Spring Gr.</option>
                            <option value="cyan" data-i18n="catCyan" style="background-color: #06b6d433;">Cyan</option>
                            <option value="azure" data-i18n="catAzure" style="background-color: #0ea5e933;">Azure</option>

        // ==========================================

        const supportedLangs = Object.keys(i18n);

        let currentLang = localStorage.getItem('genealogyLang') || (supportedLangs.includes(browserLang) ? browserLang : 'en');

        let mapInstance = null;
        let mapTileLayer = null;
        let mapMarkers = null;
        let geoCache = JSON.parse(localStorage.getItem('genealogyGeoCache') || '{}');
        let currentMapGeocodeRun = 0;

        let dbNames = JSON.parse(localStorage.getItem('genealogyDBNames'));
        if (!dbNames) {
            dbNames = ['default'];
            localStorage.setItem('genealogyDBNames', JSON.stringify(dbNames));
        }

        let currentDbName = localStorage.getItem('genealogyActiveDB') || 'default';
        if (!dbNames.includes(currentDbName)) currentDbName = dbNames[0];

        let db = JSON.parse(localStorage.getItem('genealogyData_' + currentDbName));
        if (!db || !Array.isArray(db.persons)) { db = JSON.parse(JSON.stringify(initialData)); }

        let historyStack = JSON.parse(localStorage.getItem('genealogyHistory_' + currentDbName)) || [];
        let historyIndex = parseInt(localStorage.getItem('genealogyHistoryIndex_' + currentDbName), 10);
        if (isNaN(historyIndex)) historyIndex = -1;

        if (historyStack.length === 0 || historyIndex === -1) {
            historyStack = [JSON.parse(JSON.stringify(db.persons))];
            historyIndex = 0;
            saveHistory();
        }

        let renderedIds = new Set();
        let selectedPersonId = null;

        // ==========================================
        // 3. CORE FUNCTIONS & LOGIC

        function t(key) { return (i18n[currentLang] && i18n[currentLang][key]) ? i18n[currentLang][key] : key; }

        function updateLanguageUI() {
            $('[data-i18n]').each(function() { $(this).text(t($(this).data('i18n'))); });
            $('[data-i18n-placeholder]').each(function() { $(this).attr('placeholder', t($(this).data('i18n-placeholder'))); });
            $('[data-i18n-title]').each(function() { $(this).attr('title', t($(this).data('i18n-title'))); });

            $('.lang-option').removeClass('ring-2 ring-blue-500 bg-blue-50');
            $(`.lang-option[data-lang="${currentLang}"]`).addClass('ring-2 ring-blue-500 bg-blue-50');

            $('.lang-flag').html(FLAGS[currentLang]);
            $('.lang-label').text(currentLang.toUpperCase());

            updateQuickNav();
            if (selectedPersonId) openPanel(selectedPersonId);

            renderTree();
            if (currentViewMode === 'map') openMap();
        }

        $('.lang-option').click(function() {
            currentLang = $(this).data('lang');
            localStorage.setItem('genealogyLang', currentLang);
            updateLanguageUI();
            $('.lang-menu').addClass('hidden');
        });

        $('.lang-toggle').click(function(e) {
            e.stopPropagation();
            $('.lang-menu').toggleClass('hidden');
        });

        function loadDBList() {
            const opts = dbNames.map(name =>
                `<option value="${name}" ${name === currentDbName ? 'selected' : ''}>${name}</option>`
            ).join('');
            $('#db-select, #burger-db-select').html(opts);
        }

        function centerOnLargestFamily() {
            const possibleRoots = [];
            db.persons.forEach(p => {
                if (p.gender === 'm' && !p.fatherId && !p.motherId) possibleRoots.push(p.id);
                if (p.gender === 'f' && !p.fatherId && !p.motherId && !hasActiveMalePartner(p.id)) possibleRoots.push(p.id);
            });

            let largestRoot = null;
            let maxDescendants = -1;
            possibleRoots.forEach(rootId => {
                const count = countDescendants(rootId);
                if (count > maxDescendants) { maxDescendants = count; largestRoot = rootId; }
            });

            if (largestRoot !== null) {
                scrollToPerson(largestRoot, false);
            } else if (db.persons.length > 0) {
                scrollToPerson(db.persons[0].id, false);
            } else {
                const el = document.getElementById('canvas-container');
                el.scrollLeft = 25000 - window.innerWidth / 2 + 128;
                el.scrollTop = 25000 - window.innerHeight / 2 + 100;
            }
        }

        // Fade-in the correct view after a DB switch or import operation.
        function refreshViewAfterLoad(delay = 40) {
            setTimeout(() => {
                if (currentViewMode === 'tree') {
                    setCanvasZoom(1);
                    drawLines();
                    centerOnLargestFamily();
                    $('#canvas-container').animate({ opacity: 1 }, 150);
                } else {
                    $('#map-container').animate({ opacity: 1 }, 150);
                    $('#canvas-container').css('opacity', '1').addClass('hidden');
                }
            }, delay);
        }

        function switchDatabase(name) {
            if (!dbNames.includes(name)) return;

            const $canvas = $('#canvas-container');
            $canvas.css('opacity', '0');

            currentDbName = name;
            localStorage.setItem('genealogyActiveDB', currentDbName);

            const saved = localStorage.getItem('genealogyData_' + currentDbName);
            db = saved ? JSON.parse(saved) : { persons: [] };

            historyStack = JSON.parse(localStorage.getItem('genealogyHistory_' + currentDbName)) || [JSON.parse(JSON.stringify(db.persons))];
            historyIndex = parseInt(localStorage.getItem('genealogyHistoryIndex_' + currentDbName), 10);
            if (isNaN(historyIndex)) historyIndex = 0;
            saveHistory();

            selectedPersonId = null;
            collapsedFamilies.clear();
            $('#close-panel').click();

            saveData(true);
            refreshViewAfterLoad();
        }

        function createDatabase() {
            let name = prompt(t('dbPrompt'));
            if (!name) return;
            name = name.trim();
            if (name === '') return;
            if (dbNames.includes(name)) { alert(t('dbNameExists')); return; }
            dbNames.push(name);
            localStorage.setItem('genealogyDBNames', JSON.stringify(dbNames));
            localStorage.setItem('genealogyData_' + name, JSON.stringify({ persons: [] }));

            loadDBList();
            switchDatabase(name);
        }

        function deleteDatabase() {
            if (dbNames.length <= 1) { alert(t('dbCantDeleteLast')); return; }
            const msg = t('dbDeleteConfirm').replace('{db}', currentDbName);
            if (confirm(msg)) {
                localStorage.removeItem('genealogyData_' + currentDbName);
                localStorage.removeItem('genealogyHistory_' + currentDbName);
                localStorage.removeItem('genealogyHistoryIndex_' + currentDbName);

                dbNames = dbNames.filter(n => n !== currentDbName);
                localStorage.setItem('genealogyDBNames', JSON.stringify(dbNames));

                currentDbName = dbNames[0];
                loadDBList();
                switchDatabase(currentDbName);
            }
        }

        $('#db-select, #burger-db-select').change(function() {
            const name = $(this).val();
            if (name !== currentDbName) switchDatabase(name);
        });
        $('#db-create-btn, #burger-db-create-btn').click(createDatabase);
        $('#db-delete-btn, #burger-db-delete-btn').click(deleteDatabase);

        function debouncedSaveData() {
            clearTimeout(debounceSaveTimeout);
            debounceSaveTimeout = setTimeout(() => saveData(), 200);
        }

        // --- FUZZY SEARCH LOGIC ---
        $('#global-search').on('input', function() {
            const val = $(this).val().toLowerCase().trim();
            if (!val) { $('#search-results').addClass('hidden'); return; }

            let results = [];
            db.persons.forEach(p => {
                const pName = `${p.firstName} ${p.lastName || ''}`.trim();
                const romanPlain = romanNumerals[p.id] ? ` ${romanNumerals[p.id]}` : '';
                const romanHtml = romanNumerals[p.id] ? ` <span class="text-gray-400 font-normal">${romanNumerals[p.id]}</span>` : '';
                const pNameDisplayPlain = `${pName}${romanPlain}`;
                const pNameDisplayHtml = `${pName}${romanHtml}`;
                const pNameLower = pNameDisplayPlain.toLowerCase();
                const nicknameLower = (p.nickname || '').toLowerCase();

                if (pNameLower.includes(val) || nicknameLower.includes(val)) {
                    results.push({ type: t('typePerson'), text: pNameDisplayHtml, id: p.id, score: 10 });
                }
                if (p.address && p.address.toLowerCase().includes(val)) {
                    results.push({ type: t('typeAddress'), text: p.address, personName: pNameDisplayHtml, id: p.id, score: 8 });
                }
                if (p.notes && p.notes.toLowerCase().includes(val)) {
                    results.push({ type: t('typeNote'), text: p.notes.substring(0, 40) + '...', personName: pNameDisplayHtml, id: p.id, score: 5 });
                }
                if (p.events) {

                        if (e.note && e.note.toLowerCase().includes(val)) {
                            results.push({ type: t('typeEventNote'), text: e.note.substring(0, 40) + '...', personName: pNameDisplayHtml, id: p.id, score: 4 });
                        }

                }

            results.sort((a, b) => b.score - a.score);

            // Deduplicate by (id, type, text) key

        // --- MAP LOGIC ---
        function getMajorityColor(colorsObj) {
            let maxTotal = 0, maxMales = -1, res = '#3b82f6';
            for (let c in colorsObj) {
                const stats = colorsObj[c];
                if (stats.total > maxTotal) { maxTotal = stats.total; maxMales = stats.males; res = c; }
                else if (stats.total === maxTotal && stats.males > maxMales) { maxMales = stats.males; res = c; }
            }
            return res;
        }

        function initializeMap() {
            const tileUrl = currentLang === 'de'
                ? 'https://tile.openstreetmap.de/{z}/{x}/{y}.png'
                : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

            if (!mapInstance) {
                mapInstance = L.map('map-element').setView([48.2082, 16.3738], 4);
                mapTileLayer = L.tileLayer(tileUrl, { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapInstance);
            } else if (mapTileLayer && mapTileLayer._url !== tileUrl) {
                mapTileLayer.setUrl(tileUrl);
            }
            return { previousCenter: mapInstance.getCenter(), previousZoom: mapInstance.getZoom() };
        }

        function groupMapLocations() {
            const locGroups = {};
            db.persons.forEach(p => {
                const mapItems = [];
                if (p.events) {
                    p.events.forEach(e => mapItems.push({ type: e.type, date: e.date, note: e.note, place: e.place, coordsStr: e.coordinates, involvedPersonId: e.involvedPersonId }));
                }
                if (p.address && p.address.trim() !== '') {
                    mapItems.push({ type: 'Address', date: '', note: '', place: p.address, coordsStr: '', involvedPersonId: null });
                }

                mapItems.forEach(e => {
                    const place = (e.place || "").trim();
                    const coordsStr = (e.coordsStr || "").trim();
                    if (!place && !coordsStr) return;

                    const key = coordsStr ? `coords:${coordsStr}` : `place:${place}`;
                    if (!locGroups[key]) locGroups[key] = { place: place, coordsStr: coordsStr, events: [], colors: {} };

                    const pColor = getColor(p.lastName);
                    if (!locGroups[key].colors[pColor]) locGroups[key].colors[pColor] = { total: 0, males: 0 };
                    locGroups[key].colors[pColor].total++;
                    if (p.gender === 'm') locGroups[key].colors[pColor].males++;

                    const involved = [p];
                    if (e.involvedPersonId) {
                        const invP = getPerson(e.involvedPersonId);
                        if (invP && !involved.find(ip => ip.id === invP.id)) {
                            involved.push(invP);
                            const invColor = getColor(invP.lastName);
                            if (!locGroups[key].colors[invColor]) locGroups[key].colors[invColor] = { total: 0, males: 0 };
                            locGroups[key].colors[invColor].total++;
                            if (invP.gender === 'm') locGroups[key].colors[invColor].males++;
                        }
                    }

                    const isDup = locGroups[key].events.find(existingEv =>
                        existingEv.type === e.type && existingEv.date === e.date && existingEv.involved.some(ip => ip.id === p.id)
                    );
                    if (!isDup) locGroups[key].events.push({ type: e.type, date: e.date, note: e.note, involved: involved });
                });
            });
            return locGroups;
        }

        async function fetchCoordinates(group, rateLimitState, currentRunId) {
            if (group.coordsStr) {
                const parts = group.coordsStr.split(',');
                if (parts.length === 2) return { lat: parseFloat(parts[0]), lng: parseFloat(parts[1]) };
            } else if (group.place) {
                if (geoCache[group.place]) {
                    return { lat: geoCache[group.place].lat, lng: geoCache[group.place].lng };
                } else {
                    try {
                        // Respect Nominatim rate limit: 1 request/second
                        if (rateLimitState.hasNewGeocode) await new Promise(r => setTimeout(r, 1000));
                        if (currentMapGeocodeRun !== currentRunId) return { lat: undefined, lng: undefined };

                        rateLimitState.hasNewGeocode = true;
                        console.time(`[Geocoding] API fetch for "${group.place}"`);
                        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(group.place)}`;
                        const response = await $.getJSON(url);
                        console.timeEnd(`[Geocoding] API fetch for "${group.place}"`);

                        if (currentMapGeocodeRun !== currentRunId) return { lat: undefined, lng: undefined };

                        if (response && response.length > 0) {
                            const lat = parseFloat(response[0].lat);
                            const lng = parseFloat(response[0].lon);
                            geoCache[group.place] = { lat, lng };
                            localStorage.setItem('genealogyGeoCache', JSON.stringify(geoCache));
                            return { lat, lng };
                        }
                    } catch (err) {
                        console.error("[Geocoding] Failed for:", group.place, err);
                    }
                }
            }
            return { lat: undefined, lng: undefined };
        }

        function createMapMarker(lat, lng, group) {
            const mColor = getMajorityColor(group.colors);
            const markerIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color: ${mColor}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });

            const marker = L.marker([lat, lng], { icon: markerIcon });
            let popupHtml = `<div class="popup-content max-h-56 overflow-y-auto text-gray-800 font-sans w-[240px]">
              <div class="flex items-center gap-1 mb-2 pb-1.5 border-b border-gray-200">
                  <i class="ph ph-map-pin text-orange-500 text-sm flex-shrink-0"></i>
                  <span class="font-bold text-xs text-gray-700 truncate">${group.place || group.coordsStr}</span>
              </div>`;

            group.events.sort((a, b) => parseInt(a.date || '9999') - parseInt(b.date || '9999')).forEach(e => {
                const typeKey = (e.type || 'other').toLowerCase();
                const typeColor = e.type === 'Birth' ? '#28a745' : (e.type === 'Death' ? '#dc3545' : (e.type === 'Marriage' ? '#007bff' : '#6c757d'));
                const iconHtml = ICONS[typeKey] || ICONS.other;

                const personsHtml = e.involved.map(invP => {
                    const roman = romanNumerals[invP.id] ? ` <span class="text-gray-400 font-normal">${romanNumerals[invP.id]}</span>` : '';
                    return `<span class="person-link cursor-pointer hover:text-blue-600 font-bold transition-colors" data-id="${invP.id}">${invP.firstName} ${invP.lastName || ''}${roman}</span>`;
                }).join(' <span class="text-gray-300">&amp;</span> ');

                popupHtml += `
                    <div class="flex flex-col gap-0.5 py-1.5 border-b border-gray-100 last:border-0">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide" style="color: ${typeColor}">
                                ${iconHtml} ${t(typeKey)}
                            </div>
                            <span class="text-[10px] text-gray-400">${e.date || ''}</span>
                        </div>
                        <div class="text-xs leading-snug">${personsHtml}</div>
                        ${e.note ? `<div class="text-[10px] text-gray-400 italic truncate">${e.note}</div>` : ''}
                    </div>`;
            });
            popupHtml += `</div>`;
            marker.bindPopup(popupHtml, { minWidth: 240 });
            return marker;
        }

        async function openMap() {
            const { previousCenter, previousZoom } = initializeMap();

            if (mapMarkers) mapInstance.removeLayer(mapMarkers);
            mapMarkers = L.markerClusterGroup();

            const locGroups = groupMapLocations();
            const keys = Object.keys(locGroups);

            currentMapGeocodeRun++;
            const thisRun = currentMapGeocodeRun;
            const rateLimitState = { hasNewGeocode: false };

            if (keys.length > 0) {
                $('#map-loading').removeClass('hidden');
                $('#app-loading-pct, #map-loading-pct').text('0%');
            }

            for (let i = 0; i < keys.length; i++) {
                if (currentMapGeocodeRun !== thisRun) return;

                const group = locGroups[keys[i]];
                const { lat, lng } = await fetchCoordinates(group, rateLimitState, thisRun);

                if (currentMapGeocodeRun !== thisRun) return;

                if (lat !== undefined && lng !== undefined && !isNaN(lat) && !isNaN(lng)) {
                    mapMarkers.addLayer(createMapMarker(lat, lng, group));
                }

                $('#app-loading-pct, #map-loading-pct').text(Math.round(((i + 1) / keys.length) * 100) + '%');
            }

            if (currentMapGeocodeRun !== thisRun) return;

            mapInstance.addLayer(mapMarkers);

            if (mapMarkers.getLayers().length > 0 && (!previousCenter || (previousZoom === 4 && previousCenter.lat === 48.2082))) {
                mapInstance.fitBounds(mapMarkers.getBounds(), { padding: [50, 50], maxZoom: 15 });
            }

            mapInstance.invalidateSize();
            setTimeout(() => {
                mapInstance.invalidateSize();
                $('#map-loading').addClass('hidden');
            }, 150);
        }

        // BFS using an index pointer instead of shift() for O(1) dequeue cost.
        function countDescendants(rootId) {
            let count = 0, qi = 0;
            const visited = new Set([rootId]);
            const q = [rootId];
            while (qi < q.length) {
                const curr = q[qi++];
                db.persons.forEach(p => {
                    if ((p.fatherId === curr || p.motherId === curr) && !visited.has(p.id)) {
                        visited.add(p.id);
                        count++;
                        q.push(p.id);
                    }
                });
            }
            return count;
        }

        function parseDateForSort(d) {
            if (!d) return 99999999;
            const m2 = d.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m2) return parseInt(`${m2[3]}${m2[2]}${m2[1]}`);
            const m1 = d.match(/\d{4}/);
            if (m1) return parseInt(`${m1[0]}0000`);
            return 99999999;
        }

        function getBirthYear(id) {
            const p = getPerson(id);
            if (!p) return 9999;
            const e = (p.events || []).find(ev => ev.type === 'Birth');
            if (e && e.date) {
                const m = e.date.match(/\d{4}/);
                if (m) return parseInt(m[0], 10);
                return parseInt(e.date, 10) || 9999;
            }
            return 9999;
        }

        function getBirthDateObj(id) {
            const p = getPerson(id);
            if (!p) return null;
            const b = (p.events || []).find(e => e.type === 'Birth');
            if (!b || !b.date) return null;
            const m1 = b.date.match(/^(\d{4})$/);
            if (m1) return new Date(parseInt(m1[1]), 0, 1);
            const m2 = b.date.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m2) return new Date(parseInt(m2[3]), parseInt(m2[2]) - 1, parseInt(m2[1]));
            return null;
        }

        function toRoman(num) {
          const lookup = {
            M: 1000, CM: 900, D: 500, CD: 400,
            C: 100, XC: 90, L: 50, XL: 40,
            X: 10, IX: 9, V: 5, IV: 4, I: 1
          };
          let roman = '';
          for (let i in lookup) {
            while (num >= lookup[i]) {
              roman += i;
              num -= lookup[i];
            }
          }
          return roman;
        }

        // Builds a generational graph via BFS from each unvisited node,
        // then normalises so the earliest ancestor in each component is generation 0.
        function computeGenerations() {
            personGen = {};
            const adj = {};

            // Build undirected adjacency list: parent↔child edges (offset ±1) and spouse edges (offset 0).
            db.persons.forEach(p => {
                adj[p.id] = adj[p.id] || [];
                if (p.fatherId) {
                    adj[p.id].push({ to: p.fatherId, offset: -1 });
                    adj[p.fatherId] = adj[p.fatherId] || [];
                    adj[p.fatherId].push({ to: p.id, offset: 1 });
                }
                if (p.motherId) {
                    adj[p.id].push({ to: p.motherId, offset: -1 });
                    adj[p.motherId] = adj[p.motherId] || [];
                    adj[p.motherId].push({ to: p.id, offset: 1 });
                }
                getPartners(p.id).forEach(partnerId => {
                    adj[p.id].push({ to: partnerId, offset: 0 });
                    adj[partnerId] = adj[partnerId] || [];
                    adj[partnerId].push({ to: p.id, offset: 0 });
                });
            });

            const visited = new Set();
            db.persons.forEach(startNode => {
                if (visited.has(startNode.id)) return;
                const q = [startNode.id];
                personGen[startNode.id] = 0;
                visited.add(startNode.id);
                const component = [startNode.id];
                let qi = 0;
                while (qi < q.length) {
                    const curr = q[qi++];
                    adj[curr].forEach(edge => {
                        if (!visited.has(edge.to)) {
                            personGen[edge.to] = personGen[curr] + edge.offset;
                            visited.add(edge.to);
                            q.push(edge.to);
                            component.push(edge.to);
                        }
                    });
                }
                // Shift so minimum generation in this connected component is 0
                const minGen = Math.min(...component.map(id => personGen[id]));
                component.forEach(id => { personGen[id] -= minGen; });
            });
        }

        function updateRomanNumerals() {
            computeGenerations();
            const groups = {};
            db.persons.forEach(p => {
                const nameKey = (p.firstName + " " + (p.lastName || '')).toLowerCase().trim();
                if (!groups[nameKey]) groups[nameKey] = [];
                groups[nameKey].push(p);
            });
            romanNumerals = {};
            for (const key in groups) {
                if (groups[key].length > 1) {
                    groups[key].sort((a, b) => {
                        const genA = personGen[a.id] !== undefined ? personGen[a.id] : 0;
                        const genB = personGen[b.id] !== undefined ? personGen[b.id] : 0;
                        if (genA !== genB) return genA - genB;
                        const bA = getBirthYear(a.id);
                        const bB = getBirthYear(b.id);
                        if (bA !== bB) return bA - bB;
                        return a.id - b.id;
                    });
                    groups[key].forEach((p, index) => {
                        romanNumerals[p.id] = (p.lastName && p.lastName.trim() !== '') ? toRoman(index + 1) : (index + 1).toString();
                    });
                }
            }
        }

        // Use reduce instead of spread+Math.max to avoid call-stack limits on large datasets.
        function getNextId() { return db.persons.reduce((max, p) => Math.max(max, p.id), 0) + 1; }

        function saveData(skipHistory = false) {
            clearTimeout(debounceSaveTimeout);
            localStorage.setItem('genealogyData_' + currentDbName, JSON.stringify(db));
