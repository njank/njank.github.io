                    <div class="p-1 pb-1.5 flex-grow overflow-hidden">
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <div class="flex flex-col overflow-hidden w-full">
                                <span class="text-[10px] text-gray-400 font-bold uppercase truncate leading-none mb-1" ${titleSpanAttr}>${p.title || ''}</span>
                                <div class="font-bold text-gray-800 text-sm leading-tight truncate" title="${fullNameAttr}">
                                    ${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} <span class="uppercase">${p.lastName||''}</span>${roman}
                                </div>
                            </div>
                            <div class="flex-shrink-0 flex items-center ml-1">
                                ${warningHtml}
                                ${p.gender === 'm' ? ICONS.male : ICONS.female}
                            </div>
                        </div>
                        <div class="mt-1.5 text-[11px] flex flex-col gap-0.5 min-h-[1.5rem] events-container">
                            ${buildEventsHtml(p.id)}
                        </div>
                        ${extraInfoHtml}
                    </div>
                    ${actionButtonsHtml}
                </div>`;
        }

        function calculateSuppressed() {
            suppressedIds.clear();
            let q = Array.from(collapsedFamilies);
            while (q.length > 0) {
                let curr = q.shift();
                let kidsToSuppress =[];
                let p = getPerson(curr);
                if (!p) continue;

                if (p.gender === 'm') {
                    kidsToSuppress.push(...db.persons.filter(c => c.fatherId === curr && !c.motherId).map(c=>c.id));
                    getPartners(curr).forEach(partnerId => {
                        kidsToSuppress.push(...getSharedChildren(curr, partnerId).map(c=>c.id));
                        kidsToSuppress.push(...db.persons.filter(c => c.motherId === partnerId && !c.fatherId).map(c=>c.id));
                    });
                } else {
                    kidsToSuppress.push(...db.persons.filter(c => c.motherId === curr && !c.fatherId).map(c=>c.id));
                }

                kidsToSuppress.forEach(kId => {
                    if (!suppressedIds.has(kId)) {
                        suppressedIds.add(kId);
                        q.push(kId);
                    }
                });
            }
        }

        function renderFamily(maleId, expectedGen = 0) {
            if(renderedIds.has(maleId)) return '';
            renderedIds.add(maleId);
            let actualGen = personGen[maleId] || 0;
            let margin = Math.max(0, (actualGen - expectedGen) * 320); 
            let partners = getPartners(maleId);
            let $fam = $('<div class="flex flex-row gap-16 items-stretch family-group relative"></div>');
            if (margin > 0) $fam.css('margin-left', margin + 'px');

            let $parentsBox = $(`<div class="flex flex-col gap-1 justify-center items-center relative parents-box" data-id="${maleId}"></div>`);
            $parentsBox.append(createCard(maleId));

            partners.forEach(partnerId => {
                if(!renderedIds.has(partnerId)) { 
                    $parentsBox.append(createCard(partnerId)); 
                    renderedIds.add(partnerId); 
                }
            });

            let childrenToRender =[];
            let maleKids = sortChildren(db.persons.filter(c => c.fatherId === maleId && !c.motherId));
            childrenToRender.push(...maleKids.filter(c => shouldRenderAsChild(c.id)));
            
            partners.forEach(partnerId => {
                let shared = sortChildren(getSharedChildren(maleId, partnerId));
                childrenToRender.push(...shared.filter(c => shouldRenderAsChild(c.id)));
                
                let partnerKids = sortChildren(db.persons.filter(c => c.motherId === partnerId && !c.fatherId));
                childrenToRender.push(...partnerKids.filter(c => shouldRenderAsChild(c.id)));
            });

            if (childrenToRender.length > 0) {
                let isCollapsed = collapsedFamilies.has(maleId);
                $parentsBox.append(`<button class="collapse-toggle-btn absolute -right-3 top-1/2 transform -translate-y-1/2 bg-white border border-gray-300 rounded-full w-5 h-5 flex items-center justify-center text-gray-600 z-30 hover:bg-gray-100 shadow cursor-pointer transition-colors" data-id="${maleId}">${isCollapsed ? '<i class="ph ph-plus text-xs"></i>' : '<i class="ph ph-minus text-xs"></i>'}</button>`);
                
                if (!isCollapsed) {
                    let $childrenCol = $('<div class="flex flex-col gap-1 justify-center items-start children-box"></div>');
                    childrenToRender.forEach(c => { $childrenCol.append(renderChild(c.id, actualGen + 1)); });
                    $fam.append($parentsBox);
                    $fam.append($childrenCol);
                    return $fam;
                }
            }

            $fam.append($parentsBox);
            return $fam;
        }

        function renderChild(childId, expectedGen = 0) {
            if (renderedIds.has(childId)) return '';
            let child = getPerson(childId);
            if (!child) return '';
            if (child.gender === 'm') return renderFamily(childId, expectedGen);
            else {
                renderedIds.add(childId);
                let actualGen = personGen[childId] || 0;
                let margin = Math.max(0, (actualGen - expectedGen) * 320); 
                let $singleFam = $('<div class="flex flex-row gap-16 items-stretch family-group relative"></div>');
                if (margin > 0) $singleFam.css('margin-left', margin + 'px');
                let $parentsBox = $(`<div class="flex flex-col gap-1 justify-center items-center relative parents-box" data-id="${childId}"></div>`);
                $parentsBox.append(createCard(childId));
                
                let singleKids = sortChildren(db.persons.filter(p => p.motherId === childId && !p.fatherId));
                let childrenToRender = singleKids.filter(k => shouldRenderAsChild(k.id));

                if (childrenToRender.length > 0) {
                    let isCollapsed = collapsedFamilies.has(childId);
                    $parentsBox.append(`<button class="collapse-toggle-btn absolute -right-3 top-1/2 transform -translate-y-1/2 bg-white border border-gray-300 rounded-full w-5 h-5 flex items-center justify-center text-gray-600 z-30 hover:bg-gray-100 shadow cursor-pointer transition-colors" data-id="${childId}">${isCollapsed ? '<i class="ph ph-plus text-xs"></i>' : '<i class="ph ph-minus text-xs"></i>'}</button>`);
                    
                    if (!isCollapsed) {
                        let $childrenCol = $('<div class="flex flex-col gap-1 justify-center items-start children-box"></div>');
                        childrenToRender.forEach(k => { $childrenCol.append(renderChild(k.id, actualGen + 1)); });
                        $singleFam.append($parentsBox);
                        if($childrenCol.children().length > 0) $singleFam.append($childrenCol);
                        return $singleFam;
                    }
                }
                $singleFam.append($parentsBox);
                return $singleFam;
            }
        }

        function shouldRenderAsChild(id) {
            let p = getPerson(id);
            if (!p) return false;
            if (p.gender === 'm') return true;
            if (hasActiveMalePartner(id)) return false; 
            return true;
        }

        function orderRootsSmartly(rawRoots) {
            let personToRoot = {};
            function assignRoot(pId, rId) {
                if(personToRoot[pId]) return;
                personToRoot[pId] = rId;
                db.persons.forEach(c => { if(c.fatherId === pId || c.motherId === pId) assignRoot(c.id, rId); });
            }
            rawRoots.forEach(r => assignRoot(r, r));

            let graph = {};
            rawRoots.forEach(r => graph[r] = new Set());
            db.persons.forEach(p => {
                let r1 = personToRoot[p.id];
                if(!r1) return;
                getPartners(p.id).forEach(partnerId => {
                    let r2 = personToRoot[partnerId];
                    if(r2 && r1 !== r2) { graph[r1].add(r2); graph[r2].add(r1); }
                });
            });

            let ordered =[];
            let visited = new Set();
            rawRoots.forEach(r => {
                if(!visited.has(r)) {
                    let q = [r]; visited.add(r);
                    while(q.length > 0) {
                        let curr = q.shift();
                        ordered.push(curr);
                        Array.from(graph[curr]).forEach(n => { if(!visited.has(n)) { visited.add(n); q.push(n); } });
                    }
                }
            });
            return ordered;
        }

        function renderTree() {
            renderedIds.clear();
            $('#tree-layer').empty();

            if (db.persons.length === 0) {
                $('#empty-state').removeClass('hidden'); 
                $('#canvas-container').addClass('hidden');
                $('#map-container').addClass('hidden');
                return;
            } else {
                $('#empty-state').addClass('hidden'); 
                if (currentViewMode === 'tree') {
                    $('#canvas-container').removeClass('hidden');
                    $('#map-container').addClass('hidden');
                } else if (currentViewMode === 'map') {
                    $('#map-container').removeClass('hidden');
                    $('#canvas-container').addClass('hidden');
                }
            }
            
            calculateSuppressed();

            let roots =[];
            db.persons.forEach(p => {
                let hasParent = (p.fatherId && getPerson(p.fatherId)) || (p.motherId && getPerson(p.motherId));
                if (!hasParent && !suppressedIds.has(p.id)) {
                    if (p.gender === 'm') roots.push(p.id);
                    else if (p.gender === 'f' && !hasActiveMalePartner(p.id)) roots.push(p.id);
                }
            });

            roots = orderRootsSmartly(roots);
            roots.forEach(rootId => { if(!renderedIds.has(rootId)) $('#tree-layer').append(renderChild(rootId, 0)); });

            // Catch-all loop to guarantee all isolated branches or unparented females with suppressed husbands are correctly rendered
            db.persons.forEach(p => {
                if (!renderedIds.has(p.id) && !suppressedIds.has(p.id)) {
                    if (p.gender === 'm' || !hasActiveMalePartner(p.id)) {
                        $('#tree-layer').append(renderChild(p.id, 0));
                    }
                }
            });

            if (currentViewMode === 'tree') {
                setTimeout(drawLines, 10);
            }
        }

        function drawLines() {
            let container = document.getElementById('tree-layer');
            if(container) {
                // Force browser to synchronously compute correct layout constraints
                // fixes bugs where line coords generate incorrectly before layout tick settles
                let _forceReflow = container.offsetHeight; 
            }
            
            let svg = document.getElementById('svg-layer');
            let svgRings = document.getElementById('svg-layer-rings');
            let svgLinesHtml = '', svgOverlayHtml = '';
            let zcRect = document.getElementById('zoom-container').getBoundingClientRect();

            function getCenter(el) {
                let rect = el.getBoundingClientRect();
                return { x: (rect.left + rect.width/2 - zcRect.left) / canvasZoom, y: (rect.top + rect.height/2 - zcRect.top) / canvasZoom };
            }

            db.persons.forEach(p => {
                if (p.gender === 'm') {
                    let partners = getPartners(p.id);
                    let maleEl = document.querySelector(`.person-node[data-id="${p.id}"]`);
                    if(!maleEl) return;
                    
                    let hasDrawnRing = false;

                    partners.forEach(partnerId => {
                        let femaleEl = document.querySelector(`.person-node[data-id="${partnerId}"]`);
                        if(femaleEl) {
                            let mC = getCenter(maleEl); let fC = getCenter(femaleEl);
                            let mRect = maleEl.getBoundingClientRect();
                            let fRect = femaleEl.getBoundingClientRect();
                            
                            let mBottom = (mRect.bottom - zcRect.top) / canvasZoom;
                            let fTop = (fRect.top - zcRect.top) / canvasZoom;

                            let everMarried = false;
                            let mEvents = getDisplayEvents(p.id);
                            if (mEvents.some(e => e.type === 'Marriage' && (e.involvedPersonId === partnerId || e.sourceId === partnerId))) everMarried = true;
                            
                            let femaleEvents = getDisplayEvents(partnerId);
                            let femaleIsMarried = femaleEvents.some(e => e.type === 'Marriage');
                            let isSecondarySpouse = !everMarried && femaleIsMarried;
                            let strokeAttr = isSecondarySpouse ? `stroke-dasharray="4,4"` : ``;
                            
                            // Draw continuous vertical link lines overriding the minimal gap
                            svgLinesHtml += `<path class="tree-line" d="M ${mC.x - 3} ${mBottom} L ${fC.x - 3} ${fTop}" stroke="#9ca3af" stroke-width="2" ${strokeAttr}/>`;
                            svgLinesHtml += `<path class="tree-line" d="M ${mC.x + 3} ${mBottom} L ${fC.x + 3} ${fTop}" stroke="#9ca3af" stroke-width="2" ${strokeAttr}/>`;
                            
                            let ringY = (mBottom + fTop) / 2;
                            
                            if (!hasDrawnRing) {
                                if (everMarried) {
                                    svgOverlayHtml += `<circle cx="${mC.x}" cy="${ringY}" r="12" fill="white" stroke="#d1d5db" stroke-width="1"/>`;
                                    svgOverlayHtml += `<circle cx="${mC.x - 3.5}" cy="${ringY}" r="3.5" fill="none" stroke="#4b5563" stroke-width="1.5"/><circle cx="${mC.x + 3.5}" cy="${ringY}" r="3.5" fill="none" stroke="#4b5563" stroke-width="1.5"/>`;
                                    hasDrawnRing = true;
                                } else if (!isSecondarySpouse) {
                                    svgOverlayHtml += `<circle cx="${mC.x}" cy="${ringY}" r="12" fill="white" stroke="#d1d5db" stroke-width="1"/>`;
                                    svgOverlayHtml += `<g transform="translate(${mC.x - 8}, ${ringY - 8}) scale(0.65)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#4b5563"/></g>`;
                                    hasDrawnRing = true;
                                }
                            }
                        }
                    });
                }
            });

            db.persons.forEach(child => {
                let startParentId = null;
                let startBox = null;
                let startBoxId = null;
                if (child.fatherId) {
                    startParentId = child.fatherId;
                } else if (child.motherId) {
                    startParentId = child.motherId;
                }
                let parentNode = document.querySelector(`.person-node[data-id="${startParentId}"]`);
                if (parentNode) {
                    startBox = parentNode.closest('.parents-box');
                    if (startBox) startBoxId = parseInt(startBox.getAttribute('data-id'), 10);
                }

                if (startBoxId && collapsedFamilies.has(startBoxId)) return;

                let endEl = null;
                if (child.gender === 'm' || !hasActiveMalePartner(child.id)) {
                    let cNode = document.querySelector(`.person-node[data-id="${child.id}"]`);
                    if (cNode) endEl = cNode.closest('.parents-box');
                } else {
                    endEl = document.querySelector(`.person-node[data-id="${child.id}"]`);
                }

                if (startBox && endEl) {
                    let sRect = startBox.getBoundingClientRect(); let eRect = endEl.getBoundingClientRect();
                    let x1 = (sRect.right - zcRect.left) / canvasZoom; let y1 = (sRect.top + sRect.height/2 - zcRect.top) / canvasZoom;
                    let x2 = (eRect.left - zcRect.left) / canvasZoom; let y2 = (eRect.top + eRect.height/2 - zcRect.top) / canvasZoom;
                    let isGenSkip = child.gender === 'f' && hasActiveMalePartner(child.id);
                    let strokeAttr = isGenSkip ? 'stroke-dasharray="6,6" stroke="#9ca3af"' : 'stroke="#6b7280"';
                    let sw = isGenSkip ? 3 : 2;
                    
                    let dist = Math.max(30, (x2 - x1) / 2);
                    let ctrlX1 = x1 + dist;
                    let ctrlX2 = x2 - dist;

                    svgLinesHtml += `<path class="tree-line" data-child="${child.id}" data-father="${child.fatherId||''}" data-mother="${child.motherId||''}" d="M ${x1} ${y1} C ${ctrlX1} ${y1}, ${ctrlX2} ${y2}, ${x2} ${y2}" fill="none" ${strokeAttr} stroke-width="${sw}" />`;
                }
            });

            svg.innerHTML = svgLinesHtml;
            svgRings.innerHTML = svgOverlayHtml;
            updateHighlight();
        }

        let isDown = false, hasDragged = false, startX, startY, scrollLeft, scrollTop, clickStartX, clickStartY;
        const slider = document.getElementById('canvas-container');

        document.addEventListener('mousedown', () => { hasDragged = false; }, true);
        document.addEventListener('touchstart', () => { hasDragged = false; }, true);

        function startPan(e) {
            if ($(e.target).closest('#editor-panel').length || $(e.target).closest('#action-bar').length || $(e.target).closest('#burger-menu').length || $(e.target).closest('#lang-dropdown-desktop').length || $(e.target).closest('#empty-state').length || $(e.target).closest('#map-container').length || $(e.target).closest('.leaflet-popup').length || $(e.target).closest('.collapse-toggle-btn').length || $(e.target).closest('#search-results').length || $(e.target).closest('#search-container').length) return;
            if (e.target === slider && e.offsetX !== undefined) { if (e.offsetX > slider.clientWidth || e.offsetY > slider.clientHeight) return; }

            let pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
            let pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
            clickStartX = pageX; clickStartY = pageY;
            isDown = true; slider.classList.add('grabbing-cursor');
            startX = pageX - slider.offsetLeft; startY = pageY - slider.offsetTop;
            scrollLeft = slider.scrollLeft; scrollTop = slider.scrollTop;
        }

        function endPan() { isDown = false; slider.classList.remove('grabbing-cursor'); }

        function movePan(e) {
            if (!isDown) return;
            let pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
            let pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
            let dx = Math.abs(pageX - clickStartX), dy = Math.abs(pageY - clickStartY);
            if (dx > 5 || dy > 5) hasDragged = true;
            if (e.type === 'touchmove' && e.cancelable) e.preventDefault(); 
            slider.scrollLeft = scrollLeft - (pageX - clickStartX);
            slider.scrollTop = scrollTop - (pageY - clickStartY);
        }

        document.addEventListener('mousedown', startPan);
        document.addEventListener('mousemove', movePan, {passive: false});
        document.addEventListener('mouseup', endPan);
        document.addEventListener('touchstart', startPan, {passive: true});
        document.addEventListener('touchmove', movePan, {passive: false});
        document.addEventListener('touchend', endPan);
        document.addEventListener('touchcancel', endPan);

        document.addEventListener('click', (e) => {
            if (hasDragged) { e.stopPropagation(); e.preventDefault(); hasDragged = false; return; }
            if (!$(e.target).closest('#burger-btn').length && !$(e.target).closest('#burger-menu').length && !$(e.target).closest('.import-file-replace').length && !$(e.target).closest('.import-file-merge').length) $('#burger-menu').addClass('hidden');
            if (!$(e.target).closest('#lang-dropdown-desktop').length) $('.lang-menu').addClass('hidden');

            if (!$(e.target).closest('.person-node').length && !$(e.target).closest('#editor-panel').length && !$(e.target).closest('#action-bar').length && !$(e.target).closest('#burger-menu').length && !$(e.target).closest('#lang-dropdown-desktop').length && !$(e.target).closest('.collapse-toggle-btn').length && !$(e.target).closest('#search-results').length) {
                if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
            }
        }, true);

        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement ? document.activeElement.tagName.toUpperCase() : '';
            const isInputActive =['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !isInputActive) {
                if (e.shiftKey) redo(); else undo();
                e.preventDefault();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !isInputActive) {
                redo(); e.preventDefault();
            } else if (e.key === 'Delete') {
                if (selectedPersonId && !isInputActive) $('#delete-person-btn').click();
            }
        });

        function updateHighlight() {
            $('.tree-line').removeClass('highlighted-line');
            if(selectedPersonId) {
                $(`.tree-line[data-child="${selectedPersonId}"]`).addClass('highlighted-line');
                $(`.tree-line[data-father="${selectedPersonId}"]`).addClass('highlighted-line');
                $(`.tree-line[data-mother="${selectedPersonId}"]`).addClass('highlighted-line');
            }
        }

        function openPanel(id) {
            selectedPersonId = parseInt(id, 10);
            let p = getPerson(selectedPersonId);
            if (!p) return;
            
            $('#edit-id').val(p.id);
            $('#edit-firstName').val(p.firstName);
            $('#edit-lastName').val(p.lastName || '');
            $('#edit-nickname').val(p.nickname || '');
            let activeCategory = p.category || 'none';
            $('#edit-category').val(activeCategory);
            $('#edit-category').css('background-color', activeCategory !== 'none' ? CATEGORY_COLORS[activeCategory] + '33' : '#ffffff');
            $('#edit-title').val(p.title || '');
            $('#edit-gender').val(p.gender);
            $('#edit-address').val(p.address || '');
            $('#edit-person-notes').val(p.notes || '');

            $('.gender-btn').removeClass('bg-blue-50 bg-pink-50 shadow-inner text-blue-600 text-pink-600').addClass('bg-white');
            if (p.gender === 'm') $('#gender-m-btn').removeClass('bg-white').addClass('bg-blue-50 shadow-inner text-blue-600');
            if (p.gender === 'f') $('#gender-f-btn').removeClass('bg-white').addClass('bg-pink-50 shadow-inner text-pink-600');

            let pBirthObj = getBirthDateObj(p.id);
            let popFatherOptions = `<option value="">${t('noFather')}</option>`;
            let popMotherOptions = `<option value="">${t('noMother')}</option>`;
            let childAssignOptions = `<option value="">${t('selectPerson')}</option>`;
            
            let currentMotherSpouses = p.motherId ? getPartners(p.motherId) :[];
            let currentFatherSpouses = p.fatherId ? getPartners(p.fatherId) :[];

            db.persons.forEach(op => {
                if(op.id !== p.id) {
                    let opRoman = romanNumerals[op.id] ? ` ${romanNumerals[op.id]}` : '';
                    let fullName = `${op.firstName} ${op.lastName || ''}${opRoman}`;
                    let genderSym = op.gender === 'm' ? '♂' : '♀';
                    let fullNameWithGender = `${genderSym} ${fullName}`;
                    let opBirthObj = getBirthDateObj(op.id);
                    let isOlder = true;
                    if (pBirthObj && opBirthObj && opBirthObj >= pBirthObj) isOlder = false;
                    let isYounger = true;
                    if (pBirthObj && opBirthObj && opBirthObj <= pBirthObj) isYounger = false;
                    
                    if (isOlder) {
                        if (op.gender === 'm') {
                            let mark = currentMotherSpouses.includes(op.id) ? ` ⭐` : '';
                            popFatherOptions += `<option value="${op.id}">${fullName}${mark}</option>`;
                        }
                        if (op.gender === 'f') {
                            let mark = currentFatherSpouses.includes(op.id) ? ` ⭐` : '';
                            popMotherOptions += `<option value="${op.id}">${fullName}${mark}</option>`;
                        }
                    }
                    if (op.fatherId !== p.id && op.motherId !== p.id && isYounger) {
                        childAssignOptions += `<option value="${op.id}">${fullNameWithGender}</option>`;
                    }
                }
            });
            $('#edit-father').html(popFatherOptions).val(p.fatherId || '');
            $('#edit-mother').html(popMotherOptions).val(p.motherId || '');
            $('#assign-child-select').html(childAssignOptions);

            renderEventsEditor(p.id);
            renderChildrenEditor(p.id);

            $('#editor-panel').removeClass('hidden').addClass('flex');
            $('.person-node').removeClass('ring-2 ring-blue-500 shadow-xl');
            $(`.person-node[data-id="${selectedPersonId}"]`).addClass('ring-2 ring-blue-500 shadow-xl');
            
            updateValidationUI(p);
            updateHighlight();
        }

        function renderChildrenEditor(parentId) {
            let children = sortChildren(db.persons.filter(c => c.fatherId === parentId || c.motherId === parentId));
            let html = '';
            children.forEach(c => {
                let cRoman = romanNumerals[c.id] ? ` <span class="text-gray-400">${romanNumerals[c.id]}</span>` : '';
                html += `
                <div class="flex justify-between items-center bg-gray-50 border px-1 rounded text-xs">
                    <div class="flex items-center gap-1.5 text-sm cursor-pointer person-link hover:text-blue-600 transition-colors" data-id="${c.id}">
                        ${c.gender === 'm' ? ICONS.male : ICONS.female}
                        <span class="font-bold">${c.firstName} ${c.lastName||''}${cRoman}</span>
                    </div>
                    <button class="remove-child text-red-500 hover:text-red-700 font-bold p-1 rounded hover:bg-red-100 transition-colors" data-child-id="${c.id}" title="Remove Child">
                        <i class="ph ph-x text-sm"></i>
                    </button>
                </div>`;
            });
            if(children.length === 0) html = `<div class="text-xs text-gray-400 italic">${t('noChildren')}</div>`;
            $('#edit-children-list').html(html);
        }

        function renderEventsEditor(personId) {
            let events = getDisplayEvents(personId);
            
            const typeWeight = { 'Birth': 1, 'Marriage': 2, 'Death': 3 };
            events.sort((a, b) => {
                let wA = typeWeight[a.type] || 4;
                let wB = typeWeight[b.type] || 4;
                if (wA !== wB) return wA - wB;
                
                let dateA = parseDateForSort(a.date);
                let dateB = parseDateForSort(b.date);
                if (dateA !== dateB) return dateA - dateB;
                
                return a.originalIndex - b.originalIndex;
            });
            
            let html = '';
            events.forEach((e) => {
                let pOpts = `<option value="">${t('noPerson')}</option>`;
                db.persons.forEach(op => {
                    let opRoman = romanNumerals[op.id] ? ` ${romanNumerals[op.id]}` : '';
                    let genderSym = op.gender === 'm' ? '♂' : '♀';
                    let fullNameWithGender = `${genderSym} ${op.firstName} ${op.lastName||''}${opRoman}`;
                    let partnerId = (e.sourceId !== personId) ? e.sourceId : e.involvedPersonId;
                    pOpts += `<option value="${op.id}" ${partnerId === op.id ? 'selected' : ''}>${fullNameWithGender}</option>`;
                });
                
                let isBorrowed = e.sourceId !== personId;
                let bgClass = isBorrowed ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-200';
                let borrowedBadge = isBorrowed ? `<span class="absolute top-0 left-2 text-[9px] font-bold text-blue-500 uppercase tracking-wider">Linked</span>` : '';
                
                let pickerVal = '';
                if (e.date && /^\d{2}\.\d{2}\.\d{4}$/.test(e.date)) {
                    let parts = e.date.split('.');
                    pickerVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }

                html += `
                <div class="border p-2 rounded flex flex-col gap-1.5 relative event-row shadow-sm ${bgClass}" data-source-id="${e.sourceId}" data-original-index="${e.originalIndex}">
                    ${borrowedBadge}
                    <button class="remove-event text-red-400 absolute top-1 right-1 font-bold text-xs hover:bg-red-100 p-1 rounded"><i class="ph ph-x text-sm"></i></button>
                    
                    <div class="flex gap-2 pr-6 ${isBorrowed ? 'mt-3' : ''}">
                        <select class="ev-type w-1/4 border rounded p-1 text-xs outline-none h-7" ${isBorrowed ? 'disabled' : ''}>
                            <option value="Birth" ${e.type==='Birth'?'selected':''}>${t('birth')}</option>
                            <option value="Death" ${e.type==='Death'?'selected':''}>${t('death')}</option>
                            <option value="Marriage" ${e.type==='Marriage'?'selected':''}>${t('marriage')}</option>
                            <option value="Other" ${e.type==='Other'?'selected':''}>${t('other')}</option>
                        </select>
                        <div class="relative w-1/4">
                            <input type="text" class="ev-date w-full border rounded p-1 pr-6 text-xs outline-none h-7 focus:ring focus:ring-blue-200 invalid:border-red-500 invalid:ring-1 invalid:ring-red-500" placeholder="${t('formatDate')}" value="${e.date||''}" pattern="^(\\d{4}|\\d{2}\\.\\d{2}\\.\\d{4})?$" ${isBorrowed ? 'disabled' : ''} title="Format: YYYY or DD.MM.YYYY">
                            <input type="date" class="ev-date-picker absolute right-0 w-6 h-full opacity-0 cursor-pointer" value="${pickerVal}" ${isBorrowed ? 'disabled' : ''} onclick="this.showPicker && this.showPicker()">
                            <i class="ph ph-calendar-blank absolute right-1 top-1.5 pointer-events-none text-gray-500 text-sm"></i>
                        </div>
                        <input type="text" class="ev-place w-1/4 border rounded p-1 text-xs outline-none h-7" placeholder="${t('place')}" value="${e.place||''}" ${isBorrowed ? 'disabled' : ''}>
                        <input type="text" class="ev-coords w-1/4 border rounded p-1 text-xs outline-none h-7" placeholder="${t('coords')}" value="${e.coordinates||''}" ${isBorrowed ? 'disabled' : ''}>
                    </div>
                    
                    <div class="flex gap-2">
                        ${(e.type==='Marriage') ? `<select class="ev-person w-1/3 border rounded p-1 text-xs outline-none h-7" ${isBorrowed ? 'disabled' : ''}>${pOpts}</select>` : ''}
                        <input type="text" class="ev-note flex-grow border rounded p-1 text-xs outline-none h-7 focus:ring focus:ring-blue-200" placeholder="${t('eventNotes')}" value="${e.note||''}" ${isBorrowed ? 'disabled' : ''}>
                    </div>
                </div>`;
            });
            $('#events-list').html(html);
        }

        $(document).on('change', '.ev-date-picker', function() {
            let val = $(this).val(); 
            if (val) {
                let parts = val.split('-');
                let formatted = `${parts[2]}.${parts[1]}.${parts[0]}`;
                $(this).siblings('.ev-date').val(formatted).trigger('change');
            }
        });

        $('#editor-panel').on('input change', 'input:not(.ev-date):not(.ev-place):not(.ev-coords):not(.ev-note):not(.ev-date-picker), select:not(.ev-type):not(.ev-person), textarea:not(.ev-note)', function(e) {
            if(this.id==='edit-id' || this.id==='assign-child-select' || this.id==='quick-nav-select' || this.id==='quick-nav-marriage') return;
            let id = parseInt($('#edit-id').val(), 10);
            if(!id) return;
            let p = getPerson(id);
            if(!p) return;
            
            let oldGender = p.gender;

            p.firstName = $('#edit-firstName').val();
            p.lastName = $('#edit-lastName').val();
            p.nickname = $('#edit-nickname').val();
            p.category = $('#edit-category').val();
            p.title = $('#edit-title').val();
            p.gender = $('#edit-gender').val();
            p.address = $('#edit-address').val();
            p.notes = $('#edit-person-notes').val();
            p.fatherId = $('#edit-father').val() ? parseInt($('#edit-father').val(), 10) : null;
            p.motherId = $('#edit-mother').val() ? parseInt($('#edit-mother').val(), 10) : null;

            updateValidationUI(p);

            if (this.id === 'edit-category') {
                $(this).css('background-color', p.category !== 'none' ? CATEGORY_COLORS[p.category] + '33' : '#ffffff');
            }

            // Cascade Gender Flipping Safeties
            if (oldGender !== p.gender) {
                getPartners(p.id).forEach(partnerId => {
                    let partner = getPerson(partnerId);
                    if (partner) partner.gender = (p.gender === 'm') ? 'f' : 'm';
                });
                
                db.persons.filter(c => c.fatherId === p.id || c.motherId === p.id).forEach(c => {
                    let oldFather = c.fatherId;
                    let oldMother = c.motherId;
                    if (oldFather === p.id) {
                        c.fatherId = oldMother;
                        c.motherId = p.id;
                    } else if (oldMother === p.id) {
                        c.motherId = oldFather;
                        c.fatherId = p.id;
                    }
                });
                saveData(false);
                openPanel(p.id); 
                return; 
            }

            if(this.tagName === 'SELECT' && e.type === 'change') {
                debouncedSaveData();
            }
            else if (this.tagName !== 'SELECT') {
                localStorage.setItem('genealogyData_' + currentDbName, JSON.stringify(db));
                updateRomanNumerals();
                
                let roman = romanNumerals[p.id] ? `<span class="text-gray-400 ml-1">${romanNumerals[p.id]}</span>` : '';
                let titleSpanAttr = p.title ? `title="${p.title.replace(/"/g, '&quot;')}"` : '';
                let fullNameAttr = `${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} ${p.lastName||''} ${romanNumerals[p.id]||''}`.trim().replace(/\s+/g, ' ').replace(/"/g, '&quot;');
                
                let $node = $(`.person-node[data-id="${p.id}"]`);
                $node.find('span.text-\\[10px\\]').html(p.title || '');
                if (p.title) $node.find('span.text-\\[10px\\]').attr('title', p.title.replace(/"/g, '&quot;'));
                else $node.find('span.text-\\[10px\\]').removeAttr('title');
                
                $node.find('.font-bold.text-gray-800').attr('title', fullNameAttr).html(`${p.firstName} ${p.nickname ? `"${p.nickname}"` : ''} <span class="uppercase">${p.lastName||''}</span>${roman}`);
                
                let hasOneParent = (p.fatherId && !p.motherId) || (!p.fatherId && p.motherId);
                let hasNoLastName = !p.lastName || p.lastName.trim() === '';
                let warnings =[];
                if (hasOneParent) warnings.push(t('parentMissing'));
                if (hasNoLastName) warnings.push(t('lastNameMissing'));
                let warningHtml = warnings.length > 0 ? `<i class="ph ph-warning text-amber-500 mr-1" title="${warnings.join(' / ')}"></i>` : '';
                
                $node.find('.flex-shrink-0.flex.items-center.ml-1').html(`${warningHtml}${p.gender === 'm' ? ICONS.male : ICONS.female}`);

                let extraInfoHtml = '';

                if (displayInfoModes.events) {
                    let displayEvents = getDisplayEvents(p.id);
                    let minorEvents = displayEvents.filter(ev => !['Birth', 'Death', 'Marriage'].includes(ev.type));
                    if (minorEvents.length > 0) {
                        let minorHtml = minorEvents.map(ev => {
                            let text =[ev.date, ev.place, ev.note].filter(x => x).join(' - ');
                            let iconHtml = ICONS[ev.type.toLowerCase()] || ICONS.other;
                            return `<div class="flex items-start gap-1 truncate text-gray-500" title="${text}">${iconHtml} <span class="truncate">${text}</span></div>`;
                        }).join('');
                        extraInfoHtml += `<div class="text-[11px] mt-1.5 pt-1.5 border-t border-gray-100 leading-tight flex flex-col gap-1">${minorHtml}</div>`;
                    }
                }

                if (displayInfoModes.address && p.address) {
                    extraInfoHtml += `<div class="text-[11px] text-gray-500 mt-1.5 pt-1.5 border-t border-gray-100 leading-tight overflow-hidden flex items-start gap-1" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;"><i class="ph ph-house text-gray-400 text-sm"></i> <span>${p.address}</span></div>`;
                }

                if (displayInfoModes.notes && p.notes) {
                    extraInfoHtml += `<div class="text-[11px] text-gray-500 mt-1.5 pt-1.5 border-t border-gray-100 italic leading-tight overflow-hidden" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${p.notes}</div>`;
                }
                
                $node.find('.events-container').nextAll('div:not(.action-buttons)').remove(); 
                if (extraInfoHtml) $node.find('.p-1.pb-1\\.5').append(extraInfoHtml);
                
                let borderColor = getColor(p.lastName);
                let bgColor = (p.category && p.category !== 'none' && CATEGORY_COLORS[p.category]) ? (CATEGORY_COLORS[p.category] + '33') : '#ffffff';
                $node.css('border-left', `6px solid ${borderColor}`);
                $node.css('background-color', bgColor);

                if (e.type === 'change') debouncedSaveData(); 
            }
        });

        $('#editor-panel').on('input change', '.ev-type, .ev-date, .ev-place, .ev-coords, .ev-person, .ev-note', function(e) {
            let row = $(this).closest('.event-row');
            let sId = parseInt(row.attr('data-source-id'), 10);
            let idx = parseInt(row.attr('data-original-index'), 10);
            let sourcePerson = getPerson(sId);
            if (!sourcePerson || !sourcePerson.events[idx]) return;
            
            let ev = sourcePerson.events[idx];
            let dateVal = row.find('.ev-date').val().trim();
            if (dateVal !== "" && !/^(\d{4}|\d{2}\.\d{2}\.\d{4})$/.test(dateVal)) return; 
            
            ev.type = row.find('.ev-type').val();
            ev.date = dateVal;
            ev.place = row.find('.ev-place').val();
            ev.coordinates = row.find('.ev-coords').val();
            let invId = row.find('.ev-person').val();
            ev.involvedPersonId = invId ? parseInt(invId, 10) : null;
            ev.note = row.find('.ev-note').val();

            if (e.type === 'change' && ($(this).hasClass('ev-type') || $(this).hasClass('ev-person'))) {
                clearTimeout(debounceSaveTimeout);
                debounceSaveTimeout = setTimeout(() => {
                    saveData();
                    renderEventsEditor(selectedPersonId);
                }, 200);
            } else {
                localStorage.setItem('genealogyData_' + currentDbName, JSON.stringify(db));
                $(`.person-node[data-id="${selectedPersonId}"]`).find('.events-container').html(buildEventsHtml(selectedPersonId));
                if(ev.involvedPersonId) $(`.person-node[data-id="${ev.involvedPersonId}"]`).find('.events-container').html(buildEventsHtml(ev.involvedPersonId));
                
                if (e.type === 'change' && !($(this).hasClass('ev-type') || $(this).hasClass('ev-person'))) {
                    debouncedSaveData();
                }
            }
        });

        $('#add-event-btn').click(() => {
            let id = parseInt($('#edit-id').val(), 10);
            let p = getPerson(id);
            if (!p) return;
            if(!p.events) p.events =[];
            p.events.push({type: 'Other', date: ''});
            renderEventsEditor(id);
            saveData();
        });

        $(document).on('click', '.remove-event', function() {
            let row = $(this).closest('.event-row');
            let sId = parseInt(row.attr('data-source-id'), 10);
            let idx = parseInt(row.attr('data-original-index'), 10);
            let p = getPerson(sId);
            if (p && p.events) {
                p.events.splice(idx, 1);
                saveData();
                renderEventsEditor(selectedPersonId);
            }
        });

        $('#create-first-person-btn').click(() => {
            let newId = 1;
            db.persons =[ { id: newId, firstName: "New", lastName: "Person", gender: "m", events:[] } ];
            saveData();
            openPanel(newId);
            
            let sliderEl = document.getElementById('canvas-container');
            sliderEl.scrollLeft = 25000 - window.innerWidth/2 + 128;
            sliderEl.scrollTop = 25000 - window.innerHeight/2 + 100;
        });

        $('#create-child-btn').click(() => {
            let parentId = parseInt($('#edit-id').val(), 10);
            let parent = getPerson(parentId);
            let newId = getNextId();
            let newChild = { id: newId, firstName: "New", lastName: parent.lastName, gender: "m", events:[] };
            
            let partners = getPartners(parentId);
            if (parent.gender === 'm') {
                newChild.fatherId = parentId; 
                if (partners.length > 0) newChild.motherId = partners[0];
            } else {
                newChild.motherId = parentId;
                if (partners.length > 0) newChild.fatherId = partners[0];
            }

            db.persons.push(newChild);
            saveData(); openPanel(parentId);
        });

        $('#assign-child-btn').click(() => {
            let childId = parseInt($('#assign-child-select').val(), 10);
            if(!childId) return;
            let parentId = parseInt($('#edit-id').val(), 10);
            let parent = getPerson(parentId);
            let child = getPerson(childId);
            if (parent.gender === 'm') child.fatherId = parentId; else child.motherId = parentId;
            saveData(); openPanel(parentId);
        });

        $(document).on('click', '.remove-child', function() {
            let childId = parseInt($(this).data('child-id'), 10);
            let parentId = parseInt($('#edit-id').val(), 10);
            let parent = getPerson(parentId);
            let child = getPerson(childId);
            if (parent.gender === 'm') child.fatherId = null; else child.motherId = null;
            saveData(); openPanel(parentId);
        });
        
        $(document).on('click', '.person-link', function(e) {
            e.stopPropagation();
            let id = parseInt($(this).data('id'), 10);
            openPanel(id);
            if (currentViewMode === 'tree') scrollToPerson(id);
        });

        $('#close-panel').click(() => {
            $('#editor-panel').removeClass('flex').addClass('hidden');
            selectedPersonId = null;
            $('.person-node').removeClass('ring-2 ring-blue-500 shadow-xl');
            updateHighlight();
        });

        $(document).on('click', '.person-node', function(e) {
            if($(e.target).closest('.action-buttons').length) return;
            openPanel($(this).data('id'));
        });

        $(document).on('click', '.action-father', function(e) {
            e.stopPropagation();
            let childId = parseInt($(this).closest('.person-node').data('id'), 10);
            let child = getPerson(childId);
            if(child.fatherId) openPanel(child.fatherId);
            else {
                let newId = getNextId();
                db.persons.push({ id: newId, firstName: "New", lastName: child.lastName, gender: "m", events:[] });
                child.fatherId = newId;
                saveData(); openPanel(newId);
            }
        });

        $(document).on('click', '.action-mother', function(e) {
            e.stopPropagation();
            let childId = parseInt($(this).closest('.person-node').data('id'), 10);
            let child = getPerson(childId);
            if(child.motherId) openPanel(child.motherId);
            else {
                let newId = getNextId();
                db.persons.push({ id: newId, firstName: "New", lastName: child.lastName, gender: "f", events:[] });
                child.motherId = newId;
                saveData(); openPanel(newId);
            }
        });
        
        $(document).on('click', '.action-spouse', function(e) {
            e.stopPropagation();
            let personId = parseInt($(this).closest('.person-node').data('id'), 10);
            let person = getPerson(personId);
            let newId = getNextId();
            let newGender = person.gender === 'm' ? 'f' : 'm';
            db.persons.push({ id: newId, firstName: "New", lastName: "", gender: newGender, events:[] });
            if (!person.events) person.events =[];
            person.events.push({ type: 'Marriage', date: '', place: '', involvedPersonId: newId, note: '' });
            saveData(); openPanel(newId);
        });

        $(document).on('click', '.action-child', function(e) {
            e.stopPropagation();
            let parentId = parseInt($(this).closest('.person-node').data('id'), 10);
            let parent = getPerson(parentId);
            let newId = getNextId();
            let newChild = { id: newId, firstName: "New", lastName: parent.lastName, gender: "m", events:[] };
            
            let partners = getPartners(parentId);
            if (parent.gender === 'm') {
                newChild.fatherId = parentId; 
                if (partners.length > 0) newChild.motherId = partners[0];
            } else {
                newChild.motherId = parentId;
                if (partners.length > 0) newChild.fatherId = partners[0];
            }

            db.persons.push(newChild);
            saveData(); openPanel(newId);
        });

        $('#delete-person-btn').click(() => {
            let id = parseInt($('#edit-id').val(), 10);
            if(confirm(t('confirmDelete'))) {
                db.persons = db.persons.filter(p => p.id !== id);
                db.persons.forEach(p => {
                    if(p.fatherId === id) p.fatherId = null;
                    if(p.motherId === id) p.motherId = null;
                    if(p.events) p.events = p.events.filter(e => e.involvedPersonId !== id);
                });
                $('#close-panel').click();
                saveData();
            }
        });

        function getExportData() {
            let exportDb = JSON.parse(JSON.stringify(db));
            let idMap = {};
            let newId = 1;
            
            // Generate sequence starting from 1 with no holes
            exportDb.persons.forEach(p => { idMap[p.id] = newId++; });
            
            // Remap records
            exportDb.persons.forEach(p => {
                p.id = idMap[p.id];
                if (p.fatherId) p.fatherId = idMap[p.fatherId] || null;
                if (p.motherId) p.motherId = idMap[p.motherId] || null;
                if (p.events) {
                    p.events.forEach(e => {
                        if (e.involvedPersonId) e.involvedPersonId = idMap[e.involvedPersonId] || null;
                    });
                }
            });
            return exportDb;
        }

        $('.export-json-btn').click(() => {
            $('#burger-menu').addClass('hidden');
            const dataStr = JSON.stringify(getExportData(), null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `genealogy_${currentDbName}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        $('.export-zip-btn').click(async () => {
            $('#burger-menu').addClass('hidden');
            try {
                const dataStr = JSON.stringify(getExportData());
                const stream = new Blob([dataStr], {type: 'application/json'}).stream();
                const compressedReadableStream = stream.pipeThrough(new CompressionStream('gzip'));
                const blob = await new Response(compressedReadableStream).blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `genealogy_${currentDbName}.json.gz`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) { alert("Your browser does not support the Compression Streams API yet."); }
        });

        $('.import-file-replace').change(async function(e) {
            $('#burger-menu').addClass('hidden');
            const file = e.target.files[0];
            if (!file) return;
            try {
                const buffer = await file.slice(0, 2).arrayBuffer();
                const view = new Uint8Array(buffer);
                const isGzip = view.length === 2 && view[0] === 0x1F && view[1] === 0x8B;
                let stream = file.stream();
                if (isGzip) stream = stream.pipeThrough(new DecompressionStream('gzip'));
                const jsonStr = await new Response(stream).text();
                const importedDb = JSON.parse(jsonStr);
                if (importedDb && Array.isArray(importedDb.persons)) {
                    $('#canvas-container').css('opacity', '0');
                    db = importedDb;
                    if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
                    collapsedFamilies.clear();
                    saveData(true);
                    setTimeout(() => {
                        if (currentViewMode === 'tree') {
                            setCanvasZoom(1);
                            drawLines();
                            centerOnLargestFamily();
                            $('#canvas-container').animate({opacity: 1}, 150);
                        } else {
                            $('#map-container').animate({opacity: 1}, 150);
                            $('#canvas-container').css('opacity', '1').addClass('hidden');
                        }
                    }, 40);
                } else alert("Invalid data format. Expected an array of persons.");
            } catch (err) { alert("Failed to import data. Please ensure it is a valid JSON or GZIP file."); }
            $(this).val('');
        });

        $('.import-file-merge').change(async function(e) {
            $('#burger-menu').addClass('hidden');
            const file = e.target.files[0];
            if (!file) return;
            try {
                const buffer = await file.slice(0, 2).arrayBuffer();
                const view = new Uint8Array(buffer);
                const isGzip = view.length === 2 && view[0] === 0x1F && view[1] === 0x8B;
                let stream = file.stream();
                if (isGzip) stream = stream.pipeThrough(new DecompressionStream('gzip'));
                const jsonStr = await new Response(stream).text();
                const importedDb = JSON.parse(jsonStr);

                if (importedDb && Array.isArray(importedDb.persons)) {
                    $('#canvas-container').css('opacity', '0');
                    
                    let maxId = db.persons.length > 0 ? Math.max(...db.persons.map(p => p.id)) : 0;
                    let idMap = {};
                    
                    // Assign entirely new sequential IDs based on current db maximum state
                    importedDb.persons.forEach(ip => {
                        let newId = ++maxId;
                        idMap[ip.id] = newId;
                        ip.id = newId;
                    });
                    
                    // Update relational references using the local ID mapping
                    importedDb.persons.forEach(ip => {
                        if (ip.fatherId) ip.fatherId = idMap[ip.fatherId] || null;
                        if (ip.motherId) ip.motherId = idMap[ip.motherId] || null;
                        if (ip.events) {
                            ip.events.forEach(ev => {
                                if (ev.involvedPersonId) ev.involvedPersonId = idMap[ev.involvedPersonId] || null;
                            });
                        }
                        db.persons.push(ip);
                    });
                    
                    if (!$('#editor-panel').hasClass('hidden')) $('#close-panel').click();
                    saveData(true);
                    setTimeout(() => {
                        if (currentViewMode === 'tree') {
                            setCanvasZoom(1);
                            drawLines();
                            centerOnLargestFamily();
                            $('#canvas-container').animate({opacity: 1}, 150);
                        } else {
                            $('#map-container').animate({opacity: 1}, 150);
                            $('#canvas-container').css('opacity', '1').addClass('hidden');
                        }
                    }, 40);
                } else alert("Invalid data format. Expected an array of persons.");
            } catch (err) { alert("Failed to merge data. Please ensure it is a valid JSON or GZIP file."); }
            $(this).val('');
        });

        window.addEventListener('resize', () => { if (currentViewMode === 'tree') drawLines(); });

        // INITIALIZE ALL
        loadDBList();
        
        updateRomanNumerals();
        updateLanguageUI();
        
        // Let everything build, then fade out the loader overlay and reveal the UI beautifully.
        setTimeout(() => {
            if (currentViewMode === 'tree') {
                drawLines();
                centerOnLargestFamily();
            }
            
            $('#app-loading').addClass('opacity-0 pointer-events-none');
            $('#action-bar').removeClass('opacity-0 pointer-events-none');
            if (currentViewMode === 'tree') $('#canvas-container').removeClass('hidden opacity-0');
            else $('#map-container').removeClass('hidden');

            setTimeout(() => { $('#app-loading').remove(); }, 300);
        }, 100);

    </script>
</body>
</html>
